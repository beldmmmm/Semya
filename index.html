<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a2235" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Семья">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Семья</title>
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#e3e8f0; --ink:#1b2333; --muted:#5f6a82; --line:#d5dbe5;
  --brand:#23345a; --lamp:#f0ae32; --lamp-ink:#2a1d05;
  --mine:#23345a; --mine-ink:#f5f7fb; --theirs:#ffffff; --theirs-ink:#1b2333;
  --danger:#b42318; --focus:#3d6bd6; --rec:#e5484d; --ok:#1f8a4c;
  --round: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111726; --surface:#1a2235; --surface-2:#243049; --ink:#e9edf5; --muted:#97a2ba; --line:#2d3853;
    --brand:#f0ae32; --mine:#f0ae32; --mine-ink:#24190a; --theirs:#1f2940; --theirs-ink:#e9edf5;
    --danger:#ff8a80; --focus:#8fb0ff; --ok:#5fd38d;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h,100dvh);display:flex;flex-direction:column}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ── формы ── */
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 32px)}
.wrap{max-width:420px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.brand-mark{width:52px;height:52px;flex:none;display:block}
.brand-name{font-family:var(--round);font-size:30px;font-weight:700;letter-spacing:-.01em;color:var(--brand);line-height:1.1}
.brand-sub{color:var(--muted);font-size:14px;margin-top:3px}
h2{font-family:var(--round);font-size:21px;line-height:1.25;margin:0 0 10px;font-weight:700}
p{line-height:1.45;margin:0 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;margin:0 0 20px}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .14)}
.field{display:block;margin-bottom:16px}
.field-label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field-hint{display:block;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.code-input{font-family:var(--round);font-size:19px;letter-spacing:.08em;font-weight:600}
.row{display:flex;gap:8px}
.row .input{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:12px 16px;border-radius:12px;font-weight:600;font-size:16px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--lamp);border-color:transparent;color:var(--lamp-ink);width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{min-height:0;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.6;cursor:default}
.form-error{color:var(--danger);font-size:14px;margin:0 0 12px}
.form-error:empty{display:none}
.note{font-size:13.5px;color:var(--muted)}
.steps{padding-left:22px;margin:0 0 20px;line-height:1.5}
.steps li{margin-bottom:8px}
.alt{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:4px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--lamp);border-radius:50%;animation:spin .8s linear infinite;margin:48px auto}

/* ── чат ── */
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 10px 10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand-mark{width:36px;height:36px}
.top-text{flex:1;min-width:0}
.top-title{font-family:var(--round);font-weight:700;font-size:18px;line-height:1.2}
.top-status{font-size:12.5px;color:var(--muted)}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.hint{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 14px;background:var(--surface-2);font-size:13.5px;line-height:1.35}
.hint p{margin:0;flex:1}
.hint .btn.primary{width:auto}
.hint-actions{display:flex;align-items:center;gap:4px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 12px 10px}
.older{display:block;margin:4px auto 0}
.msgs{display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.day{align-self:center;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:4px 11px;border-radius:999px;margin:16px 0 6px}
.msg{display:flex;flex-direction:column;max-width:82%;margin-top:10px}
.msg.grouped{margin-top:3px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.theirs{align-self:flex-start;align-items:flex-start}
.who{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 3px 12px}
.bubble{position:relative;padding:8px 12px 7px;border-radius:18px;line-height:1.38;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.mine .bubble{background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:6px}
.theirs .bubble{background:var(--theirs);color:var(--theirs-ink);border-bottom-left-radius:6px;box-shadow:0 0 0 1px var(--line)}
.mine.grouped .bubble{border-top-right-radius:6px}
.theirs.grouped .bubble{border-top-left-radius:6px}
.bubble a{color:inherit}
.bubble.locked{font-style:italic;opacity:.75}
.time{float:right;font-size:11px;opacity:.62;margin:7px 0 -3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bubble.media{padding:4px;white-space:normal}
.bubble.media .time{position:absolute;right:10px;bottom:9px;margin:0;float:none;opacity:1;background:rgb(0 0 0 / .5);color:#fff;padding:1px 7px;border-radius:9px}
.photo-wrap{display:block;width:240px;max-width:100%;max-height:340px;min-height:80px;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.photo{display:block;width:100%;height:100%;object-fit:cover}
.photo-wrap.failed{display:grid;place-items:center;color:var(--muted);font-size:13px}
.photo-wrap.failed::after{content:"Фото не загрузилось"}
.audio{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0 0}
.play{width:38px;height:38px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--lamp);color:var(--lamp-ink)}
.mine .play{background:var(--mine-ink);color:var(--mine)}
.play:disabled{opacity:.6}
.abar{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,currentColor 22%,transparent);cursor:pointer;position:relative}
.afill{height:100%;width:0;border-radius:3px;background:currentColor}
.adur{font-size:12.5px;opacity:.8;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.empty{text-align:center;color:var(--muted);padding:56px 24px;max-width:340px;margin:0 auto}
.empty p:first-child{font-family:var(--round);font-size:19px;font-weight:700;color:var(--ink)}
.compose{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:var(--surface);border-top:1px solid var(--line)}
.kb .compose{padding-bottom:8px}
.compose .icon-btn{width:44px;height:44px;color:var(--muted)}
.compose-input{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;line-height:1.35;padding:10px 14px;border-radius:21px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-height:140px;display:block}
.compose-input:focus{outline:none;border-color:var(--focus)}
.send{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--lamp);color:var(--lamp-ink);display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.5}
.rec{flex:1;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px;font-size:16px;font-variant-numeric:tabular-nums}
.rec-dot{width:11px;height:11px;border-radius:50%;background:var(--rec);animation:blink 1s ease-in-out infinite}
.rec-label{color:var(--muted)}

/* ── всплывающие окна ── */
.overlay{position:fixed;inset:0;background:rgb(8 12 22 / .5);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s ease-out}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease-out}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sheet-head h2{margin:0}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:13px 2px;cursor:pointer}
.menu button:last-child{border-bottom:0}
.menu b{font-weight:600;font-size:16px}
.menu span{font-size:13.5px;color:var(--muted)}
.menu .danger b{color:var(--danger)}
.linkbox{width:100%;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;word-break:break-all;margin:4px 0 10px;display:block}
.btn-row{display:flex;gap:8px;margin-bottom:14px}
.btn-row .btn{flex:1;width:auto}
.code{font-family:var(--round);font-size:30px;font-weight:700;letter-spacing:.06em;text-align:center;padding:18px 10px;background:var(--surface-2);border-radius:14px;margin:6px 0 14px;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all}
.people{list-style:none;padding:0;margin:0}
.people li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.people li:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.tag{font-size:12.5px;color:var(--muted)}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;animation:fade .15s ease-out}
.viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.viewer-bar .icon-btn{color:#fff}
.viewer-bar .btn{background:rgb(255 255 255 / .14);border-color:transparent;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── ответы, правка, медиатека ── */
.quote{display:block;width:100%;max-width:300px;text-align:left;border:0;border-left:3px solid var(--lamp);background:color-mix(in srgb,currentColor 9%,transparent);border-radius:8px;padding:5px 9px;margin:2px 0 6px;cursor:pointer;font:inherit;color:inherit;white-space:normal}
.mine .quote{border-left-color:currentColor}
.quote b{display:block;font-size:13px;line-height:1.3}
.quote span{display:block;font-size:14px;line-height:1.3;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.flash .bubble{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--lamp)}100%{box-shadow:0 0 0 0 transparent}}
@media (pointer:coarse){.bubble{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.bubble img{-webkit-touch-callout:none}}
.cbar{display:flex;align-items:center;gap:8px;padding:8px 6px 0 14px;background:var(--surface);border-top:1px solid var(--line)}
.cbar + .compose{border-top:0}
.cbar-text{flex:1;min-width:0;border-left:3px solid var(--lamp);padding-left:10px}
.cbar-text b{display:block;font-size:13px;color:var(--brand)}
.cbar-text span{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu button.plain{flex-direction:row;align-items:center}
.gallery{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;animation:fade .15s ease-out}
.g-tabwrap{padding:10px 12px 0;background:var(--bg)}
.g-tabwrap .seg{margin:0}
.g-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
.g-month{font-family:var(--round);font-weight:700;font-size:15px;padding:16px 14px 8px}
.g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
@media (min-width:700px){.g-grid{grid-template-columns:repeat(5,1fr)}}
.g-cell{aspect-ratio:1;border:0;padding:0;background:var(--surface-2);overflow:hidden;cursor:zoom-in;display:block}
.g-cell img{width:100%;height:100%;object-fit:cover;display:block}
.g-voice{padding:10px 14px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.g-voice-head{font-size:13px;color:var(--muted);margin-bottom:4px}
.g-empty{text-align:center;color:var(--muted);padding:64px 24px}
.g-sentinel{height:1px}
.viewer-stage{flex:1;min-height:0;position:relative;display:flex;touch-action:pan-y}
.viewer-stage img{flex:1;min-width:0;min-height:0;width:100%;object-fit:contain;padding-bottom:env(safe-area-inset-bottom);transition:opacity .15s}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255 / .16);color:#fff;display:grid;place-items:center;cursor:pointer}
.v-nav.prev{left:10px}.v-nav.next{right:10px}
.v-actions{display:flex;gap:8px}
.vcount{color:#fff;opacity:.8;font-size:14px;font-variant-numeric:tabular-nums}
/* ── реакции, прочтение, видео ── */
.scroll{touch-action:manipulation}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mine .reacts{justify-content:flex-end}
.react{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 8px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.5}
.react.on{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 22%,var(--surface))}
.react-e{font-size:15px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:4px 0 12px}
.emoji-grid button{border:0;background:transparent;font-size:25px;line-height:1;padding:7px 0;border-radius:10px;cursor:pointer}
.emoji-grid button.on{background:color-mix(in srgb,var(--lamp) 28%,transparent)}
.ticks{margin-left:3px;letter-spacing:-.18em;opacity:.9}
.ticks.read{color:var(--lamp);opacity:1}
.mine .ticks.read{color:inherit}
.top-status.live{color:var(--ok)}
.info-list{margin:0 0 10px;font-size:14px;line-height:1.5;color:var(--muted)}
.info-list b{color:var(--ink);font-weight:600}
.video-wrap{position:relative;cursor:pointer;background:#000}
.video-wrap .photo{opacity:.92}
.v-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgb(0 0 0 / .55);color:#fff;display:grid;place-items:center}
.v-dur{position:absolute;left:8px;top:8px;background:rgb(0 0 0 / .55);color:#fff;font-size:12px;padding:1px 7px;border-radius:9px;font-variant-numeric:tabular-nums}
.v-exp{position:absolute;left:8px;bottom:9px;background:rgb(0 0 0 / .55);color:#fff;font-size:11.5px;padding:1px 7px;border-radius:9px}
.video-wrap.expired .photo{opacity:.35;filter:grayscale(1)}
.video-wrap.expired .v-play{display:none}
.v-loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:6px;font-size:15px}
.v-loading .spinner{margin:0}
.viewer-stage video{flex:1;min-width:0;min-height:0;width:100%;background:#000;padding-bottom:env(safe-area-inset-bottom)}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.g-cell{position:relative}
.g-cell .v-dur{top:auto;bottom:5px;left:5px}
.g-cell.expired img{opacity:.35;filter:grayscale(1)}
/* ── список чатов ── */
.clist{max-width:760px;margin:0 auto}
.clist-sep{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:16px 16px 6px}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;cursor:pointer;border-radius:14px}
.crow:hover{background:var(--surface-2)}
.crow-av{position:relative;flex:none;display:grid}
.crow-av .brand-mark,.crow-av .avatar{width:50px;height:50px;font-size:19px}
.crow-av.online::after{content:"";position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
.crow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.crow-top,.crow-bottom{display:flex;align-items:center;gap:8px;min-width:0}
.crow-top b{flex:1;min-width:0;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-time{font-size:12.5px;color:var(--muted);flex:none}
.crow-prev{flex:1;min-width:0;font-size:14.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--lamp);color:var(--lamp-ink);font-size:12.5px;font-weight:700;display:grid;place-items:center}
.top .avatar{width:36px;height:36px;font-size:15px}
.icon-btn.dot{position:relative}
.icon-btn.dot::after{content:"";position:absolute;top:7px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--lamp)}
.people li.tap{cursor:pointer}
.people .btn{margin-left:auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px)}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
'use strict';

// ═══════════════ НАСТРОЙКИ ═══════════════
const SUPABASE_URL = 'https://ygxkeqxuzkslrcukjyuu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WJqWcvbm8Ldr6quJwFOKkA_SwgGJ6-v';
const APP_NAME     = 'Семья';
// ═════════════════════════════════════════

const LS_KEY  = 'fc.familyKey';
const LS_HINT = 'fc.hint2.';
const PAGE = 200;
const COLS = 'id,sender,iv,body,created_at,kind,edited_at,deleted';
const CODE_ABC = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';   // без похожих I, O, 0, 1

}

function idbOpen() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('semya', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbSet(k, v) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch (e) { /* без этого уведомления просто будут без текста */ }
}

const enc = new TextEncoder(), dec = new TextDecoder();
function b64e(bytes) {
  const b = new Uint8Array(bytes); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64d(str) {
  let s = str.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
async function importKey(b64) {
  const raw = b64d(b64);
  if (raw.length !== 32) throw new Error('Неверный ключ');
  return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}
async function setKey(b64) {
  familyKey = await importKey(b64);
  familyKeyB64 = b64;
  localStorage.setItem(LS_KEY, b64);
  await idbSet('familyKey', b64);
}
async function loadKey() {
  const k = localStorage.getItem(LS_KEY);
  if (!k) return;
  try { familyKey = await importKey(k); familyKeyB64 = k; idbSet('familyKey', k); }
  catch (e) { localStorage.removeItem(LS_KEY); }
}
async function newKey() { await setKey(b64e(rand(32))); }

// Сообщение — JSON {t: текст, f: файл}. Отправитель вшит в проверку: подменить автора на сервере нельзя.
async function encryptMsg(obj, senderId) {
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(senderId) }, familyKey, enc.encode(JSON.stringify(obj)));
  return { iv: b64e(iv), body: b64e(ct) };
}
async function decryptMsg(m, key) {
  try {
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64d(m.iv), additionalData: enc.encode(m.sender) }, key || familyKey, b64d(m.body));
    const o = JSON.parse(dec.decode(pt));
    const okPath = (x) => typeof x === 'string' && /^[A-Za-z0-9_-]{16,64}$/.test(x);
    let f = o.f && typeof o.f === 'object' && okPath(o.f.path) && (o.f.kind === 'image' || o.f.kind === 'audio' || o.f.kind === 'video') ? o.f : null;
    if (f && f.th && !okPath(f.th)) f = Object.assign({}, f, { th: null });
    const r = o.r && typeof o.r === 'object' && Number.isInteger(o.r.id) && typeof o.r.s === 'string'
      ? { id: o.r.id, s: o.r.s, t: String(o.r.t || '').slice(0, 140), k: o.r.k === 'image' || o.r.k === 'audio' || o.r.k === 'video' ? o.r.k : null } : null;
    return { ok: true, text: String(o.t == null ? '' : o.t), file: f, reply: r };
  } catch (e) { return { ok: false, text: '', file: null, reply: null }; }
}
async function keyFingerprint() {
  const d = new Uint8Array(await crypto.subtle.digest('SHA-256', b64d(familyKeyB64)));
  const parts = [];
  for (let i = 0; i < 8; i += 2) parts.push(String(((d[i] << 8) | d[i + 1]) % 10000).padStart(4, '0'));
  return parts.join(' ');
}

// ───────────── коды: приглашение и новый телефон ─────────────
// Код из 10 знаков. Из него на телефоне выводятся адрес записи и ключ, которым
// зашифрован ключ семьи. Сам код и ключ семьи на сервер не попадают.
function randomCode() { return Array.from(rand(10), (x) => CODE_ABC[x & 31]).join(''); }
const fmtCode = (c) => c.slice(0, 5) + '-' + c.slice(5);
const CYR = { 'А': 'A', 'В': 'B', 'Е': 'E', 'К': 'K', 'М': 'M', 'Н': 'H', 'О': 'O', 'Р': 'P', 'С': 'C', 'Т': 'T', 'У': 'Y', 'Х': 'X' };
function findCode(text) {
  const s0 = String(text || '');
  if (findKey(s0)) return null;   // это резервный ключ, а не код
  const m = s0.match(/[#&?]c=([0-9A-Za-z]{10})(?![0-9A-Za-z])/);
  if (m) return m[1].toUpperCase();
  const s = s0.toUpperCase().replace(/[АВЕКМНОРСТУХ]/g, (ch) => CYR[ch]);
  const m2 = s.match(/(?:^|[^0-9A-Z])([2-9A-HJ-NP-Z]{5})[\s-]?([2-9A-HJ-NP-Z]{5})(?![0-9A-Z])/);
  if (m2) return m2[1] + m2[2];
  const only = s.replace(/[^0-9A-Z]/g, '');
  return only.length === 10 && [...only].every((c) => CODE_ABC.includes(c)) ? only : null;
}
function findKey(text) {
  const s = String(text || '').replace(/&amp;/g, '&').replace(/%23/gi, '#').replace(/%26/gi, '&').replace(/%3D/gi, '=');
  const m = s.match(/[#&?]k=([A-Za-z0-9_-]{43})(?![A-Za-z0-9_-])/);
  return m ? m[1] : null;
}
const isOldInvite = (text) => /[#&?]i=[0-9a-f]{32}/.test(String(text || ''));
async function codeKeys(code) {
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode('semya-code:' + SUPABASE_URL), iterations: 300000, hash: 'SHA-256' }, base, 512));
  return {
    lookup: b64e(bits.slice(0, 32)),
    kek: await crypto.subtle.importKey('raw', bits.slice(32), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']),
  };
}
async function makeCode(kind) {
  const code = randomCode();
  const { lookup, kek } = await codeKeys(code);
  const iv = rand(12);
  const blob = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, kek, b64d(familyKeyB64));
  const { error } = await sb.rpc('create_code', { p_kind: kind, p_lookup: lookup, p_blob: b64e(blob), p_iv: b64e(iv) });
  if (error) throw error;
  return code;
}
async function unwrapFamilyKey(kek, res) {
  if (!res || !res.blob || !res.iv) throw new Error('Не удалось получить ключ семьи. Попросите новый код.');
  let raw;
  try { raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(res.iv) }, kek, b64d(res.blob)); }
  catch (e) { throw new Error('Код не подошёл к ключу. Попросите новый код.'); }
  await setKey(b64e(raw));
}

async function logout() {

  stopChat();
  stopLive();
  try {
    const sub = swReg && swReg.pushManager ? await swReg.pushManager.getSubscription() : null;
    if (sub) { await sb.rpc('delete_push_sub', { p_endpoint: sub.endpoint }); await sub.unsubscribe(); }
  } catch (e) { /* не страшно */ }

async function route() {
  if (!sb) return location.reload();
  showLoading();
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; }
  catch (e) { return showFatal(errText(e)); }
  if (!session) return showAuth();
  me = session.user;
  accessToken = session.access_token;
  const { data, error } = await sb.from('members').select('user_id,name,is_admin').eq('user_id', me.id).maybeSingle();
  if (error) return showFatal(errText(error), { logout: true });
  if (!data) return showJoin();
  myMember = data;
  if (!familyKey) await loadKey();
  if (!familyKey) return showNeedKey();
  await startLive();
  if (pendingOpen) { const peer = pendingOpen; pendingOpen = null; return openRoom(peer); }
  showList();
}

function pushState() {
  if (!('serviceWorker' in navigator)) return 'unsupported';
  if (isIOS && !isStandalone) return 'install';
  if (!('PushManager' in window) || !('Notification' in window)) return 'unsupported';
  return Notification.permission;   // default | granted | denied
}
async function getVapid() {
  const { data, error } = await sb.rpc('get_vapid_public');
  if (error) throw error;
  if (data) return data;
  if (!myMember || !myMember.is_admin) return null;
  // Администратор при первом запуске создаёт ключи для отправки уведомлений
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  const pub = b64e(await crypto.subtle.exportKey('raw', kp.publicKey));
  const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
  const r = await sb.rpc('set_vapid', { p_public: pub, p_jwk: { kty: jwk.kty, crv: jwk.crv, x: jwk.x, y: jwk.y, d: jwk.d } });
  if (r.error) throw r.error;
  return r.data;
}
function sameBytes(a, b) { if (!a || !b || a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
async function ensurePushSub() {
  const reg = swReg || await navigator.serviceWorker.ready;
  const pub = await getVapid();
  if (!pub) throw new Error('Уведомления заработают, когда администратор откроет обновлённое приложение');
  const want = b64d(pub);
  let sub = await reg.pushManager.getSubscription();
  const have = sub && sub.options && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
  if (sub && have && !sameBytes(have, want)) { await sub.unsubscribe(); sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_sub', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (error) throw error;
}
function enablePushClick() {
  if (!('Notification' in window)) return toast('Этот браузер не поддерживает уведомления');
  // Разрешение спрашиваем сразу по нажатию — иначе iPhone откажет
  Notification.requestPermission().then(async (perm) => {
    if (perm !== 'granted') { toast('Уведомления не разрешены'); refreshHint(); return; }
    try { await ensurePushSub(); toast('Уведомления включены'); }
    catch (e) { toast('Не получилось: ' + errText(e)); }
    refreshHint();
  });
}

async function ingest(rows) {
  const c = chat;
  const res = { added: [], changed: [] };
  if (!c || !rows || !rows.length) return res;
  const work = rows.filter((r) => { const e = c.rows.get(r.id); return !e || e.body !== r.body || e.deleted !== !!r.deleted; });
  const plain = await Promise.all(work.map((r) => (r.deleted ? null : decryptMsg(r))));
  if (chat !== c) return res;
  let unknown = false;
  work.forEach((r, i) => {
    const old = c.rows.get(r.id);
    if (old && old.body === r.body && old.deleted === !!r.deleted) return;
    const p = plain[i] || { ok: true, text: '', file: null, reply: null };
    c.rows.set(r.id, { id: r.id, sender: r.sender, at: new Date(r.created_at), body: r.body, deleted: !!r.deleted,
                       edited: !!r.edited_at, ok: p.ok, text: p.text, file: p.file, reply: p.reply });
    if (old) { res.changed.push(r.id); c.media.delete(r.id); }
    else { res.added.push(r.id); c.minId = Math.min(c.minId, r.id); c.maxId = Math.max(c.maxId, r.id); }
    if (!fam.members.has(r.sender)) unknown = true;
  });
  if (unknown) await loadMembers();
  return res;
}

function linkify(text) {
  const span = h('span', { class: 'txt' });
  const re = /https?:\/\/[^\s<>"']+/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    const url = m[0].replace(/[.,!?;:)\]»]+$/, '');
    span.append(text.slice(last, m.index), h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, url));
    last = m.index + url.length;
    re.lastIndex = last;
  }
  span.append(text.slice(last));
  return span;
}

// ───────────── файлы: фото и голосовые ─────────────
function randomPath() { return b64e(rand(18)); }
function fileUrl(f) {
  if (!fileCache.has(f.path)) {
    fileCache.set(f.path, (async () => {
      const { data, error } = await sb.storage.from('files').download(f.path);
      if (error) throw error;
      const ct = new Uint8Array(await data.arrayBuffer());
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(f.iv), additionalData: enc.encode('file:' + f.path) }, familyKey, ct);
      const blob = new Blob([pt], { type: f.mime || 'application/octet-stream' });
      blobCache.set(f.path, blob);
      return URL.createObjectURL(blob);
    })().catch((e) => { fileCache.delete(f.path); throw e; }));
  }
  return fileCache.get(f.path);
}
async function freshToken() {
  try { const s = (await sb.auth.getSession()).data.session; accessToken = s ? s.access_token : accessToken; } catch (e) { /* старый токен */ }
}
const storageUrl = (path, read) => SUPABASE_URL + '/storage/v1/object/' + (read ? 'authenticated/' : '') + 'files/' + path;
function xhrReq(method, url, body, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open(method, url);
    x.setRequestHeader('apikey', SUPABASE_KEY);
    if (accessToken) x.setRequestHeader('Authorization', 'Bearer ' + accessToken);
    if (method === 'GET') x.responseType = 'arraybuffer';
    else { x.setRequestHeader('Content-Type', 'application/octet-stream'); x.setRequestHeader('x-upsert', 'false'); }
    const target = method === 'GET' ? x : x.upload;
    if (onProgress) target.onprogress = (e) => { if (e.lengthComputable && e.total) onProgress(e.loaded / e.total); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) return resolve(x.response);
      if (method === 'GET' && (x.status === 400 || x.status === 404)) return reject(new Error('not_found'));
      let msg = 'Ошибка сервера ' + x.status;
      try { const j = JSON.parse(x.responseText); if (j.message) msg = j.message; } catch (e) { /* не JSON */ }
      if (x.status === 413) msg = 'Файл больше 50 МБ';
      reject(new Error(msg));
    };
    x.onerror = () => reject(new Error('Failed to fetch'));
    x.send(body || null);
  });
}
function videoUrl(f, onProgress) {
  if (!fileCache.has(f.path)) {
    fileCache.set(f.path, (async () => {
      await freshToken();
      const buf = await xhrReq('GET', storageUrl(f.path, true), null, onProgress);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(f.iv), additionalData: enc.encode('file:' + f.path) }, familyKey, buf);
      const blob = new Blob([pt], { type: f.mime || 'video/mp4' });
      blobCache.set(f.path, blob);
      return URL.createObjectURL(blob);
    })().catch((e) => { fileCache.delete(f.path); throw e; }));
  }
  return fileCache.get(f.path);
}
async function uploadEncrypted(blob, onProgress) {
  const path = randomPath();
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode('file:' + path) }, familyKey, await blob.arrayBuffer());
  const payload = new Blob([ct], { type: 'application/octet-stream' });
  if (onProgress) {
    await freshToken();
    await xhrReq('POST', storageUrl(path), payload, onProgress);
  } else {
    const { error } = await sb.storage.from('files').upload(path, payload, { contentType: 'application/octet-stream', upsert: false });
    if (error) throw error;
  }
  blobCache.set(path, blob);
  fileCache.set(path, Promise.resolve(URL.createObjectURL(blob)));   // своё видно сразу, без скачивания
  return { path, iv: b64e(iv) };
}
const extOf = (mime) => ({ 'video/quicktime': 'mov', 'video/mp4': 'mp4', 'video/webm': 'webm', 'image/jpeg': 'jpg' }[(mime || '').split(';')[0]] || 'mp4');
function saveBlob(blob, name) {
  const file = new File([blob], name, { type: blob.type || 'application/octet-stream' });
  if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).catch(() => {});   // на iPhone: «Сохранить видео» / «Сохранить изображение»
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function expLabel(exp) {
  const ms = Date.parse(exp) - Date.now();
  if (!(ms > 0)) return 'удалено';
  const hrs = Math.floor(ms / 3600000);
  return hrs >= 1 ? 'удалится через ' + hrs + ' ч' : 'удалится через ' + Math.max(1, Math.round(ms / 60000)) + ' мин';
}
const isExpired = (f) => !!f.exp && Date.parse(f.exp) <= Date.now();

// кадр для обложки, размеры и длительность видео
function videoMeta(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const v = h('video', { muted: true, playsinline: true, preload: 'auto', style: 'position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0' });
    v.muted = true;
    let done = false;
    const finish = (poster) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      const r = { w: v.videoWidth || 0, h: v.videoHeight || 0, dur: isFinite(v.duration) ? Math.round(v.duration) : 0, poster };
      v.pause(); v.remove(); URL.revokeObjectURL(url);
      resolve(r);
    };
    const timer = setTimeout(() => finish(null), 8000);
    const draw = async () => {
      if (done || v.readyState < 2 || !v.videoWidth) return;
      try {
        const s = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight));
        const cv = document.createElement('canvas');
        cv.width = Math.round(v.videoWidth * s); cv.height = Math.round(v.videoHeight * s);
        cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
        const b = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.72));
        finish(b);
      } catch (e) { finish(null); }
    };
    v.addEventListener('loadeddata', () => { try { v.currentTime = Math.min(0.3, (v.duration || 1) / 2); } catch (e) { draw(); } });
    v.addEventListener('seeked', draw);
    v.addEventListener('timeupdate', () => { if (v.currentTime > 0) { v.pause(); draw(); } });
    v.addEventListener('error', () => finish(null));
    document.body.append(v);
    v.src = url;
    v.play().catch(() => { /* на некоторых телефонах без запуска — ничего */ });
  });
}
async function sendVideo(file) {
  const c = chat;

    const mime = file.type || (/\.mov$/i.test(file.name || '') ? 'video/quicktime' : 'video/mp4');
    const th = meta.poster ? await uploadEncrypted(meta.poster) : null;
    const v = await uploadEncrypted(new Blob([file], { type: mime }), (p) => { if (chat === c) { c.progress = p; setStatus(); } });
    const { data: exp, error } = await sb.rpc('register_expiring', { p_path: v.path });
    if (error) throw error;
    await postMsg({ v: 1, t: '', f: { kind: 'video', path: v.path, iv: v.iv, mime, size: file.size, w: meta.w, h: meta.h, dur: meta.dur,
      th: th ? th.path : null, thiv: th ? th.iv : null, exp } }, 'video');
  } catch (e) {
    toast('Видео не отправлено: ' + errText(e));
  } finally { c.uploads--; c.progress = null; setStatus(); }
}

async function drawScaled(img, max, quality) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * s)), hh = Math.max(1, Math.round(img.naturalHeight * s));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = hh;
  canvas.getContext('2d').drawImage(img, 0, 0, w, hh);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));
  if (!blob) throw new Error('Не удалось сжать фото');
  return { blob, w, h: hh };
}

  } catch (e) {

      finally { btn.disabled = false; }
      if (!audio) return;
    }

function mediaFor(m) {
  const c = chat;
  let el = c.media.get(m.id);
  if (!el) {
    el = m.file.kind === 'image' ? imageWidget(m.file, m.id) : m.file.kind === 'video' ? videoWidget(m.file) : audioWidget(m.file);
    c.media.set(m.id, el);
    c.io.observe(el);
  }
  if (el.refresh) el.refresh();
  return el;
}

function openViewer(items, index, opts) {

    } catch (e) { if (want === i) toast('Не удалось открыть фото'); }
  }

  const share = h('button', { class: 'btn small', type: 'button', onclick: () => {

    items.length > 1 && !coarse ? [

  stage.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    else if (dy > 90 && dy > Math.abs(dx)) close();
  });
  const v = h('div', { class: 'viewer', role: 'dialog', 'aria-label': 'Фото' },
    h('div', { class: 'viewer-bar' },
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Закрыть', onclick: close }, iconClose()),
      count, h('div', { class: 'v-actions' }, inChat, share)),

// ───────────── медиатека ─────────────
function monthLabel(d) {

  return s.charAt(0).toUpperCase() + s.slice(1);
}
function openGallery() {
  if (!chat) return;
  const room = chat.peer;
  const g = { tab: 'image', rows: [], done: false, loading: false, token: 0, cells: new Map() };
  const tabs = h('div', { class: 'seg seg3', role: 'tablist' });
  const body = h('div', {});
  const sentinel = h('div', { class: 'g-sentinel' });

  const io = new IntersectionObserver((entries) => {
    for (const en of entries) if (en.isIntersecting) { io.unobserve(en.target); if (en.target.load) en.target.load(); }
  }, { root: scroll, rootMargin: '400px 0px' });

  const close = () => { io.disconnect(); more.disconnect(); v.remove(); if (nowPlaying) nowPlaying.pause(); };
  const v = h('div', { class: 'gallery', role: 'dialog', 'aria-label': 'Медиатека' },
    h('header', { class: 'top' },
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Назад', onclick: close }, iconBack()),
      h('div', { class: 'top-text' }, h('div', { class: 'top-title' }, 'Медиатека'))),
    h('div', { class: 'g-tabwrap' }, tabs), scroll);

  const tab = (label, t) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(g.tab === t), class: g.tab === t ? 'on' : null, onclick: () => setTab(t) }, label);
  function setTab(t) {
    g.tab = t; g.rows = []; g.done = false; g.loading = false; g.token++; g.cells = new Map();
    if (nowPlaying) nowPlaying.pause();
    tabs.replaceChildren(tab('Фото', 'image'), tab('Видео', 'video'), tab('Голосовые', 'audio'));
    body.replaceChildren();
    scroll.scrollTop = 0;
    loadMore();
  }
  function cell(r) {
    let el = g.cells.get(r.id);
    if (el) return el;
    if (g.tab === 'image') {
      const img = h('img', { alt: 'Фото', decoding: 'async' });
      el = h('button', { class: 'g-cell', type: 'button', 'aria-label': 'Открыть фото' }, img);
      el.load = () => fileUrl(thumbOf(r.f)).then((u) => { img.src = u; }).catch(() => {});
      el.addEventListener('click', () => openViewer(g.rows.map((x) => ({ id: x.id, f: x.f })), g.rows.findIndex((x) => x.id === r.id), { onChat: close }));
    } else if (g.tab === 'video') {
      const img = h('img', { alt: 'Видео', decoding: 'async' });
      el = h('button', { class: 'g-cell' + (isExpired(r.f) ? ' expired' : ''), type: 'button', 'aria-label': 'Смотреть видео' }, img, h('span', { class: 'v-dur' }, fmtDur(r.f.dur)));
      el.load = () => { if (r.f.th && r.f.thiv) fileUrl(thumbOf(r.f)).then((u) => { img.src = u; }).catch(() => {}); };
      el.addEventListener('click', () => (isExpired(r.f) ? toast('Видео удалено: они хранятся сутки') : openVideo(r.f)));

      return;
    }
    const frag = document.createDocumentFragment();
    let key = null, grid = null;
    for (const r of g.rows) {
      if (g.tab !== 'audio') {
        const k = r.at.getFullYear() + '-' + r.at.getMonth();
        if (k !== key) { key = k; frag.append(h('div', { class: 'g-month' }, monthLabel(r.at))); grid = h('div', { class: 'g-grid' }); frag.append(grid); }
        grid.append(cell(r));
      } else {
        const k = r.at.toDateString();
        if (k !== key) { key = k; frag.append(h('div', { class: 'g-month' }, dayLabel(r.at))); }
        frag.append(h('div', { class: 'g-voice' }, h('div', { class: 'g-voice-head' }, memberName(r.sender) + ', ' + fmtTime(r.at)), cell(r)));

    const token = g.token;
    if (!g.rows.length) render();
    try {
      const from = g.rows.length;
      const { data, error } = await roomFilter(sb.from('messages').select(COLS), room).eq('kind', g.tab).eq('deleted', false)
        .order('id', { ascending: false }).range(from, from + 89);
      if (token !== g.token) return;
      if (error) throw error;
      const plain = await Promise.all(data.map((r) => decryptMsg(r)));
      if (token !== g.token) return;
      data.forEach((r, i) => {
        if (plain[i].ok && plain[i].file && plain[i].file.kind === g.tab) g.rows.push({ id: r.id, sender: r.sender, at: new Date(r.created_at), f: plain[i].file });
      });
      if (data.length < 90) g.done = true;
      render();
    } catch (e) {
      if (token === g.token) { g.done = true; render(); toast(errText(e)); }
    } finally {
      if (token === g.token) {
        g.loading = false;
        if (!g.done && sentinel.getBoundingClientRect().top < scroll.getBoundingClientRect().bottom + 600) setTimeout(loadMore, 0);
      }
    }
  }
  document.body.append(v);
  more.observe(sentinel);
  setTab('image');

// ───────────── голосовые ─────────────
function recSupported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function pickMime() {
  for (const t of ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm']) {
    try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) { /* дальше */ }
  }
  return '';
}
function updateAction() {
  const c = chat;
  if (!c) return;
  const mic = !c.ta.value.trim() && recSupported();
  c.send.dataset.mode = mic ? 'mic' : 'send';
  c.send.replaceChildren(mic ? iconMic() : iconSend());
  c.send.setAttribute('aria-label', mic ? 'Записать голосовое' : 'Отправить');
}
async function startRec() {
  const c = chat;
  if (!c || rec) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { return toast('Нет доступа к микрофону. Разрешите его в настройках телефона.'); }
  if (chat !== c) { stream.getTracks().forEach((t) => t.stop()); return; }
  const mime = pickMime();
  let mr;
  try { mr = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: 48000 }, mime ? { mimeType: mime } : {})); }
  catch (e) {
    try { mr = new MediaRecorder(stream); }
    catch (e2) { stream.getTracks().forEach((t) => t.stop()); return toast('На этом телефоне запись голоса не работает'); }
  }
  const r = { mr, stream, chunks: [], start: Date.now(), timer: null, label: h('span', {}, '0:00') };
  mr.ondataavailable = (e) => { if (e.data && e.data.size) r.chunks.push(e.data); };
  mr.start();
  rec = r;
  const cancel = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Удалить запись', onclick: () => finishRec(false) }, iconTrash());
  const sendRec = h('button', { class: 'send', type: 'button', 'aria-label': 'Отправить голосовое', onclick: () => finishRec(true) }, iconSend());
  c.compose.replaceChildren(cancel, h('div', { class: 'rec' }, h('span', { class: 'rec-dot' }), r.label, h('span', { class: 'rec-label' }, 'Запись…')), sendRec);
  r.timer = setInterval(() => {
    const s = (Date.now() - r.start) / 1000;
    r.label.textContent = fmtDur(s);
    if (s >= MAX_REC) finishRec(true);
  }, 250);
}
function finishRec(send) {
  const r = rec;
  if (!r) return;
  rec = null;
  clearInterval(r.timer);
  const dur = Math.round((Date.now() - r.start) / 1000);
  const c = chat;
  if (c) { c.compose.replaceChildren(c.attach, c.ta, c.send); updateAction(); }
  r.mr.onstop = async () => {
    r.stream.getTracks().forEach((t) => t.stop());
    if (!send || !chat) return;
    if (dur < 1 || !r.chunks.length) return toast('Слишком короткое голосовое');
    const type = (r.mr.mimeType || r.chunks[0].type || 'audio/mp4').split(';')[0];
    await sendAudio(new Blob(r.chunks, { type }), type, dur);
  };
  try { r.mr.stop(); } catch (e) { r.stream.getTracks().forEach((t) => t.stop()); }
}

// ───────────── сообщения ─────────────
function snippetOf(m) {
  if (!m || !m.ok) return 'Сообщение';
  if (m.file) return m.file.kind === 'image' ? '📷 Фото' : m.file.kind === 'video' ? '🎬 Видео' : '🎤 Голосовое сообщение';
  const t = m.text.replace(/\s+/g, ' ').trim();
  return t.length > 120 ? t.slice(0, 119) + '…' : t;
}
function quoteNode(r) {

  const text = orig ? (orig.deleted ? 'Удалённое сообщение' : snippetOf(orig)) : r.t;
  return h('button', { class: 'quote', type: 'button', onclick: (e) => { e.stopPropagation(); jumpTo(r.id); } },
    h('b', {}, memberName(r.s)), h('span', {}, text));
}
function msgNode(m, prev) {
  const mine = m.sender === me.id;
  const grouped = !!prev && prev.sender === m.sender && (m.at - prev.at) < 5 * 60 * 1000;
  const time = h('span', { class: 'time' }, (m.edited ? 'изм. ' : '') + fmtTime(m.at), mine ? ticksNode(m) : null);
  let bubble;
  if (!m.ok) bubble = h('div', { class: 'bubble locked' }, h('span', { class: 'txt' }, 'Не удалось расшифровать'), time);
  else if (m.file && (m.file.kind === 'image' || m.file.kind === 'video')) bubble = h('div', { class: 'bubble media' }, mediaFor(m), time);
  else if (m.file) bubble = h('div', { class: 'bubble' }, mediaFor(m), time);
  else bubble = h('div', { class: 'bubble' }, m.reply ? quoteNode(m.reply) : null, linkify(m.text), time);
  return h('div', { class: 'msg ' + (mine ? 'mine' : 'theirs') + (grouped ? ' grouped' : ''), 'data-id': String(m.id) },
    !mine && !grouped && !chat.peer ? h('div', { class: 'who' }, memberName(m.sender)) : null, bubble, reactsNode(m));
}
function readers(m) {

    const p = fam.members.get(chat.peer);

  }

}
function ticksNode(m) {

}
function reactsNode(m) {
  const mm = chat.reacts.get(m.id);
  if (!mm || !mm.size) return null;
  const counts = new Map();
  for (const e of mm.values()) counts.set(e, (counts.get(e) || 0) + 1);
  const mineE = mm.get(me.id);
  const list = [...counts].sort((a, b) => b[1] - a[1] || REACTIONS.indexOf(a[0]) - REACTIONS.indexOf(b[0]));

function emptyState() {

    return h('div', { class: 'empty' }, h('p', {}, 'Личная переписка'),
      h('p', {}, 'Её видите только вы и ' + memberName(chat.peer) + '. Сообщения зашифрованы, сервер их не читает.'));
  }

    h('p', {}, 'Здесь пока тихо'),
    h('p', {}, alone
      ? 'Пригласите родных: меню ⋯ → «Пригласить в семью». А первое сообщение можно написать уже сейчас.'
      : 'Напишите первое сообщение.'));

function renderAll() {
  const c = chat;
  if (!c) return;
  const list = [...c.rows.values()].filter((m) => !m.deleted).sort((a, b) => a.id - b.id);
  const frag = document.createDocumentFragment();
  let prev = null;
  for (const m of list) {
    if (!prev || !sameDay(prev.at, m.at)) { frag.append(h('div', { class: 'day' }, dayLabel(m.at))); prev = null; }
    frag.append(msgNode(m, prev));
    prev = m;
  }
  if (!list.length) frag.append(emptyState());
  c.msgs.replaceChildren(frag);
}

function nearBottom() { const s = chat.scroll; return s.scrollHeight - s.scrollTop - s.clientHeight < 120; }
function scrollBottom() {
  if (!chat) return;
  chat.stick = true;
  requestAnimationFrame(() => { if (chat) chat.scroll.scrollTop = chat.scroll.scrollHeight; });
}
function autosize() {
  const ta = chat && chat.ta;
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight + 2, 140) + 'px';

async function onIncoming(rows) {
  const c = chat;
  if (!c) return;
  const stick = c.stick;
  const res = await ingest(rows);
  if ((!res.added.length && !res.changed.length) || chat !== c) return;
  renderAll();
  if (res.added.length && stick) { scrollBottom(); markRead(); }
  else if (res.added.length && rows.some((r) => res.added.includes(r.id) && r.sender !== me.id)) toast('Новое сообщение внизу');
}

// подтянуть правки и удаления, которые могли пройти мимо (телефон спал)
async function resync() {
  const c = chat;
  if (!c) return;
  const { data, error } = await roomFilter(sb.from('messages').select(COLS), c.peer).order('id', { ascending: false }).limit(PAGE);
  if (error || chat !== c) return;
  await onIncoming(data);
  await Promise.all([loadMembers(), loadReads()]);
  await loadReactions(c.minId);
  if (chat !== c) return;
  renderAll();
  setStatus();
  if (c.stick) scrollBottom();
  markRead();
  if (fam.presence) fam.presence.track({ at: Date.now() }).catch(() => {});
}

async function jumpTo(id) {
  const c = chat;
  if (!c) return;
  let guard = 0;
  while (!c.rows.has(id) && !c.older.hidden && guard++ < 50 && chat === c) await loadOlder();
  const el = c.msgs.querySelector('.msg[data-id="' + id + '"]');
  if (!el) return toast('Сообщение не найдено — возможно, его удалили');
  c.stick = false;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

async function fetchNewer() {
  const c = chat;
  if (!c || c.fetching) return;
  c.fetching = true;
  try {
    const { data, error } = await roomFilter(sb.from('messages').select(COLS), c.peer).gt('id', c.maxId).order('id', { ascending: true }).limit(500);
    if (!error && data.length) await onIncoming(data);
  } finally { c.fetching = false; }
}

  if (chat !== c) return;
  c.older.disabled = false;
  if (error) return toast(errText(error));
  c.older.hidden = data.length < PAGE;
  const fromBottom = c.scroll.scrollHeight - c.scroll.scrollTop;
  const prevMin = c.minId;
  await ingest(data);
  await loadReactions(c.minId, prevMin);
  renderAll();
  c.scroll.scrollTop = c.scroll.scrollHeight - fromBottom;
}

async function postMsg(obj, kind) {
  const c = chat;
  const { iv, body } = await encryptMsg(obj, me.id);
  const row = { sender: me.id, iv, body, kind: kind || 'text' };
  if (c && c.peer) row.to_user = c.peer;
  const { data, error } = await sb.from('messages').insert(row).select(COLS).single();
  if (error) throw error;
  if (chat === c) { c.stick = true; await onIncoming([data]); }
}

async function doSend() {
  const c = chat;
  if (!c || c.sending) return;
  const text = c.ta.value.trim();
  if (!text) return;
  const editing = c.editing;
  c.sending = true; c.send.disabled = true;
  try {
    if (editing) await saveEdit(editing, text);
    else {
      const obj = { v: 1, t: text };
      if (c.replyTo) obj.r = c.replyTo;
      await postMsg(obj, 'text');
    }
    if (chat === c) { c.ta.value = ''; autosize(); clearBar(); updateAction(); }
  } catch (e) {
    toast((editing ? 'Не сохранено: ' : 'Не отправлено: ') + errText(e));
  } finally { c.sending = false; c.send.disabled = false; }
}

function setBar(title, text) {
  const c = chat;
  c.bar.replaceChildren(
    h('div', { class: 'cbar-text' }, h('b', {}, title), h('span', {}, text)),
    h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Отменить', onclick: cancelBar }, iconClose()));
  c.bar.hidden = false;
}
function clearBar() {
  const c = chat;
  if (!c) return;
  c.replyTo = null; c.editing = null;
  c.bar.hidden = true; c.bar.replaceChildren();
}
function cancelBar() {
  const c = chat;
  if (!c) return;
  if (c.editing) { c.ta.value = ''; autosize(); }
  clearBar(); updateAction();
}
function startReply(m) {
  const c = chat;
  if (c.editing) { c.ta.value = ''; autosize(); }
  c.editing = null;
  c.replyTo = { id: m.id, s: m.sender, t: snippetOf(m), k: m.file ? m.file.kind : null };
  setBar('Ответ: ' + memberName(m.sender), snippetOf(m));
  updateAction();
  c.ta.focus();
}
function startEdit(m) {
  const c = chat;
  c.replyTo = null; c.editing = m.id;
  c.ta.value = m.text; autosize(); updateAction();
  setBar('Редактирование', snippetOf(m));
  c.ta.focus();
}
async function saveEdit(id, text) {
  const c = chat;
  const m = c.rows.get(id);
  if (!m || m.deleted) throw new Error('Сообщение уже удалено');
  const obj = { v: 1, t: text };
  if (m.reply) obj.r = m.reply;
  const { iv, body } = await encryptMsg(obj, me.id);
  const { data, error } = await sb.from('messages').update({ iv, body, edited_at: new Date().toISOString() }).eq('id', id).select(COLS).single();
  if (error) throw error;
  if (chat === c) await onIncoming([data]);
}
async function deleteMsg(m) {
  if (!confirm('Удалить сообщение у всех?')) return;
  const c = chat;
  try {
    const { data, error } = await sb.from('messages').update({ iv: '', body: '', deleted: true, edited_at: new Date().toISOString() }).eq('id', m.id).select(COLS).single();
    if (error) throw error;
    if (m.file) sb.storage.from('files').remove([m.file.path, m.file.th].filter(Boolean)).catch(() => {});
    if (c && (c.editing === m.id || (c.replyTo && c.replyTo.id === m.id))) cancelBar();
    if (chat === c) await onIncoming([data]);
  } catch (e) { toast('Не удалось удалить: ' + errText(e)); }
}
function openMsgActions(id) {
  const c = chat;
  const m = c && c.rows.get(id);
  if (!m || m.deleted) return;
  const now = Date.now();
  if (now - c.lastActions < 700) return;
  c.lastActions = now;
  const mine = m.sender === me.id;
  const mm = c.reacts.get(id);
  const myE = mm ? mm.get(me.id) : null;
  const item = (title, fn, cls) => h('button', { type: 'button', class: cls || null, onclick: () => { close(); fn(); } }, h('b', {}, title));
  const info = [];
  if (mm && mm.size) info.push(h('p', { class: 'info-list' }, h('b', {}, 'Реакции: '), [...mm].map(([uid, e]) => memberName(uid) + ' ' + e).join(', ')));
  if (mine) {
    const r = readers(m).map((x) => x.name);
    info.push(h('p', { class: 'info-list' }, h('b', {}, 'Прочитали: '), r.length ? r.join(', ') : 'пока никто'));
  }
  const close = sheet(mine ? 'Ваше сообщение' : memberName(m.sender),
    h('p', { class: 'note' }, snippetOf(m)),
    m.ok ? h('div', { class: 'emoji-grid' }, REACTIONS.map((e) => h('button', { type: 'button', class: e === myE ? 'on' : null, 'aria-label': 'Реакция ' + e,
      onclick: () => { close(); toggleReaction(id, e); } }, e))) : null,
    ...info,
    h('div', { class: 'menu' },
      m.ok ? item('Ответить', () => startReply(m)) : null,
      !mine && !c.peer ? item('Написать лично', () => openRoom(m.sender)) : null,
      m.ok && !m.file && m.text ? item('Копировать', () => copyText(m.text)) : null,
      m.ok && m.file && m.file.kind === 'image' ? item('Открыть фото', () => { const items = chatImages(); openViewer(items, items.findIndex((x) => x.id === m.id)); }) : null,
      m.ok && m.file && m.file.kind === 'video' && !isExpired(m.file) ? item('Смотреть и скачать', () => openVideo(m.file)) : null,
      mine && m.ok && !m.file ? item('Изменить', () => startEdit(m)) : null,
      mine ? item('Удалить у всех', () => deleteMsg(m), 'danger') : null));
}

// ───────────── реакции ─────────────
async function encReact(mid, emoji) {
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode('react:' + mid + ':' + me.id) }, familyKey, enc.encode(JSON.stringify({ e: emoji })));
  return { iv: b64e(iv), body: b64e(ct) };
}
async function decReact(r) {
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(r.iv), additionalData: enc.encode('react:' + r.message_id + ':' + r.user_id) }, familyKey, b64d(r.body));
    const e = JSON.parse(dec.decode(pt)).e;
    return REACTIONS.includes(e) ? e : null;
  } catch (e) { return null; }
}
function setReact(mid, uid, e) {
  const c = chat;
  let mm = c.reacts.get(mid);
  if (!mm) { if (!e) return; mm = new Map(); c.reacts.set(mid, mm); }
  if (e) mm.set(uid, e); else { mm.delete(uid); if (!mm.size) c.reacts.delete(mid); }
}
async function loadReactions(fromId, toId) {
  const c = chat;
  if (!c || !isFinite(fromId)) return;
  let q = sb.from('reactions').select('message_id,user_id,iv,body').gte('message_id', fromId);
  if (toId != null) q = q.lt('message_id', toId);
  const { data, error } = await q.limit(5000);
  if (error || chat !== c) return;
  const plain = await Promise.all(data.map(decReact));
  if (chat !== c) return;
  for (const id of [...c.reacts.keys()]) if (id >= fromId && (toId == null || id < toId)) c.reacts.delete(id);
  data.forEach((r, i) => { if (plain[i]) setReact(r.message_id, r.user_id, plain[i]); });
}
async function onReaction(type, row) {
  const c = chat;
  if (!c || !row || row.message_id == null) return;
  if (type !== 'DELETE' && !c.rows.has(row.message_id)) return;
  if (type === 'DELETE') setReact(row.message_id, row.user_id, null);
  else {
    const e = await decReact(row);
    if (chat !== c) return;
    setReact(row.message_id, row.user_id, e);
  }
  if (c.rows.has(row.message_id)) renderAll();
}
async function toggleReaction(mid, emoji) {
  const c = chat;
  if (!c || !c.rows.has(mid) || c.rows.get(mid).deleted) return;
  const mm = c.reacts.get(mid);
  const cur = mm ? mm.get(me.id) || null : null;
  const next = cur === emoji ? null : emoji;
  setReact(mid, me.id, next); renderAll();
  try {
    if (next) {
      const { iv, body } = await encReact(mid, next);
      const { error } = await sb.from('reactions').upsert({ message_id: mid, user_id: me.id, iv, body }, { onConflict: 'message_id,user_id' });
      if (error) throw error;
    } else {
      const { error } = await sb.from('reactions').delete().eq('message_id', mid).eq('user_id', me.id);
      if (error) throw error;
    }
  } catch (e) {
    if (chat === c) { setReact(mid, me.id, cur); renderAll(); }
    toast('Реакция не сохранилась: ' + errText(e));
  }
}

// ───────────── кто в сети и кто прочитал ─────────────
async function joinPresence() {
  try { await sb.realtime.setAuth(); } catch (e) { /* возьмёт токен сам */ }
  if (!fam.started) return;
  const ch = sb.channel('family', { config: { private: true, presence: { key: me.id } } });
  ch.on('presence', { event: 'sync' }, () => {
    fam.onlineIds = new Set(Object.keys(ch.presenceState()).filter((k) => k !== me.id));
    setStatus();
    if (listUi) renderList();
  }).subscribe((st) => {
    if (st === 'SUBSCRIBED') ch.track({ at: Date.now() }).catch(() => {});
  });
  fam.presence = ch;
}
function markRead() {
  const c = chat;
  if (!c || document.visibilityState !== 'visible' || !c.stick || !(c.maxId > c.readSent)) return;
  clearTimeout(c.readTimer);
  c.readTimer = setTimeout(async () => {
    if (chat !== c) return;
    const id = c.maxId, peer = c.peer || FAMILY;
    const { error } = await sb.rpc('mark_read2', { p_peer: peer, p_id: id });
    if (!error) { c.readSent = Math.max(c.readSent, id); fam.reads.set(me.id + '|' + peer, Math.max(readPtr(me.id, peer), id)); }
  }, 700);
}
function touchSeen() { if (me && fam.started) sb.rpc('touch_seen').then(() => {}, () => {}); }
function touchSeenOnLeave() {
  if (!fam.started || !accessToken) return;
  try {
    fetch(SUPABASE_URL + '/rest/v1/rpc/touch_seen', { method: 'POST', keepalive: true, body: '{}',
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' } }).catch(() => {});
  } catch (e) { /* не страшно */ }
}
function onMemberUpdate(row) {
  if (!row || !row.user_id) return;
  const old = fam.members.get(row.user_id) || {};
  fam.members.set(row.user_id, Object.assign({}, old, row));
  if (chat && Number(old.last_read_id || 0) !== Number(row.last_read_id || 0)) renderAll();
  setStatus();
}
function seenLabel(m) {
  if (m.user_id === me.id) return 'это вы';
  if (fam.onlineIds.has(m.user_id)) return 'в сети';
  if (!m.last_seen) return '';
  const d = new Date(m.last_seen), y = new Date();
  y.setDate(y.getDate() - 1);
  const day = sameDay(d, new Date()) ? 'сегодня' : sameDay(d, y) ? 'вчера' : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  return 'был(а) ' + day + ' в ' + fmtTime(d);
}

// ───────────── меню ─────────────
function sheet(title, ...content) {
  const overlay = h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const close = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);
  overlay.append(h('div', { class: 'sheet' },
    h('div', { class: 'sheet-head' }, h('h2', {}, title),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Закрыть', onclick: close }, iconClose())),
    ...content));
  document.body.append(overlay);
  return close;
}
function shareRow(text) {
  const row = h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => copyText(text) }, 'Скопировать'));
  if (navigator.share) row.append(h('button', { class: 'btn', type: 'button', onclick: () => navigator.share({ text }).catch(() => {}) }, 'Поделиться'));
  return row;
}

function openMenu() {
  const item = (title, sub, fn, cls) => h('button', { type: 'button', class: cls || null, onclick: () => { close(); fn(); } },
    h('b', {}, title), h('span', {}, sub));
  const close = sheet('Меню', h('div', { class: 'menu' },
    myMember.is_admin ? item('Пригласить в семью', 'Код для одного человека', doInvite) : null,
    item('Код для нового телефона', 'Чтобы войти на другом устройстве', doDeviceCode),
    item('Уведомления', 'Включить или проверить', showPushSettings),
    item('Участники', 'Кто в семье, написать лично', showMembers),
    item('Резервный ключ', 'На случай, если потеряются все телефоны', showBackupKey),
    item('Код проверки', 'Убедиться, что у всех один ключ', showFingerprint),
    item('Выйти', 'Из аккаунта на этом устройстве', logout, 'danger')));
}

async function doInvite() {
  let code;
  try { code = await makeCode('invite'); } catch (e) { return toast(errText(e)); }
  const text = 'Приглашение в наш семейный чат «' + APP_NAME + '».\nСсылка: ' + baseUrl() + '#c=' + code + '\nКод: ' + fmtCode(code);
  sheet('Приглашение',
    h('p', {}, 'Отправьте одному человеку. Код работает один раз и действует 7 дней.'),
    h('div', { class: 'code' }, fmtCode(code)),
    shareRow(text),
    h('p', { class: 'note' }, 'Ключа шифрования в приглашении нет, только код. Если ссылка откроется неправильно, человек просто введёт эти 10 знаков в приложении.'));
}

async function doDeviceCode() {
  let code;
  try { code = await makeCode('device'); } catch (e) { return toast(errText(e)); }
  sheet('Код для нового телефона',
    h('div', { class: 'code' }, fmtCode(code)),
    h('p', {}, 'Войдите на новом устройстве со своим email и паролем — приложение попросит этот код. Подойдёт и для члена семьи, если он сменил телефон.'),
    shareRow('Код для нового телефона в «' + APP_NAME + '»: ' + fmtCode(code)),

}

function showBackupKey() {
  const link = baseUrl() + '#k=' + familyKeyB64;
  const ta = h('textarea', { class: 'linkbox', readonly: true, rows: '3', 'aria-label': 'Резервный ключ' });
  ta.value = link;
  ta.addEventListener('focus', () => ta.select());
  sheet('Резервный ключ',
    h('p', {}, 'Сохраните в заметках под паролем. Пригодится, если потеряются все телефоны: войдите с email и паролем и вставьте эту ссылку вместо кода.'),
    ta,
    h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => copyText(link) }, 'Скопировать')),
    h('p', { class: 'note' }, 'Это ключ ко всей переписке. Не отправляйте его в мессенджеры и никому вне семьи.'));
}

function showPushSettings() {
  const st = pushState();
  const parts = [];
  if (st === 'install') {
    parts.push(h('p', {}, 'На iPhone уведомления работают только у приложения с экрана «Домой». В Safari: «Поделиться» → «На экран „Домой“». Потом войдите там и введите код из меню ⋯ → «Код для нового телефона».'));
  } else if (st === 'unsupported') {
    parts.push(h('p', {}, 'Здесь уведомления не поддерживаются. На iPhone нужна iOS 16.4 или новее и приложение с экрана «Домой».'));
  } else if (st === 'denied') {
    parts.push(h('p', {}, 'Уведомления запрещены. Включите их в настройках: на iPhone — Настройки → Уведомления → «' + APP_NAME + '», на Android — значок замка в адресной строке Chrome → Уведомления.'));
  } else if (st === 'granted') {
    const btn = h('button', { class: 'btn primary', type: 'button' }, 'Проверить подписку');
    btn.addEventListener('click', () => busy(btn, null, async () => { await ensurePushSub(); toast('Всё в порядке'); }));
    parts.push(h('p', {}, 'Уведомления включены. В них видно, кто написал, и сам текст: его расшифровывает ваш телефон.'), btn);
  } else {
    parts.push(h('p', {}, 'Включите, чтобы узнавать о новых сообщениях, даже когда приложение закрыто.'),
      h('button', { class: 'btn primary', type: 'button', onclick: enablePushClick }, 'Включить уведомления'));
  }
  sheet('Уведомления', ...parts);
}

async function showMembers() {
  await loadMembers();
  const list = [...fam.members.values()];
  const close = sheet('Участники', h('ul', { class: 'people' }, list.map((m) => {
    const isMe = m.user_id === me.id;
    return h('li', { class: isMe ? null : 'tap', onclick: isMe ? null : () => { close(); openRoom(m.user_id); } },
      h('span', { class: 'avatar', style: 'background:' + avatarColor(m.name) }, initials(m.name)),
      h('div', {}, h('div', {}, m.name + (isMe ? ' (вы)' : '')),
        h('div', { class: 'tag' }, [seenLabel(m), m.is_admin ? 'администратор' : ''].filter(Boolean).join(', '))),
      isMe ? null : h('span', { class: 'btn small' }, 'Написать'));
  })));
}

async function showFingerprint() {
  const code = await keyFingerprint();
  sheet('Код проверки', h('div', { class: 'code' }, code),
    h('p', {}, 'У всех членов семьи этот код должен совпадать. Сверьте его при встрече или по телефону. Если у кого-то он другой — у него неправильный ключ.'));
}

// ───────────── запуск ─────────────
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitViewport);
  visualViewport.addEventListener('scroll', fitViewport);
}
addEventListener('resize', fitViewport);
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; refreshHint(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (chat) resync(); else if (listUi) reloadList();
    if (fam.presence) fam.presence.track({ at: Date.now() }).catch(() => {});
    if (chat) clearBadge();
  }
  else touchSeenOnLeave();
});
addEventListener('online', () => fetchNewer());

(async function start() {
  document.title = APP_NAME;
  fitViewport();
  const openMatch = location.hash.match(/[#&]open=(family|[0-9a-f-]{36})/);
  if (openMatch) { pendingOpen = openMatch[1] === 'family' ? FAMILY : openMatch[1]; history.replaceState(null, '', location.pathname + location.search); }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'open') openRoom(e.data.room === 'family' ? FAMILY : e.data.room);
    });
  }
  if (location.hash.length > 1) {
    const hash = location.hash;
    const code = findCode(hash), key = findKey(hash);
    if (code || key) incoming = { code, key, raw: location.href };
    else if (isOldInvite(hash)) incoming = { old: true };
    // Ключ из адресной строки убираем сразу. Код оставляем, пока он не использован,
    // чтобы ссылка не терялась при переходе из мессенджера в Safari.
    if (key || !code || isStandalone) history.replaceState(null, '', location.pathname + location.search);
  }
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) return showFatal('Откройте приложение по адресу, который начинается с https://', { reload: true });
  if (!window.supabase || !window.supabase.createClient) return showFatal('Не загрузилась нужная библиотека. Проверьте интернет и нажмите «Повторить».', { reload: true });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then((r) => { swReg = r; }).catch(() => { /* без уведомлений */ });
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });
  sb.auth.onAuthStateChange((event, session) => {
    accessToken = session ? session.access_token : null;
    if (event === 'SIGNED_OUT' && chat) setTimeout(() => { stopChat(); route(); }, 0);
  });
  if (incoming && (incoming.code || incoming.key) && isIOS && !isStandalone) return showInstall();
  await acceptIncomingKey();
  route();
})();
