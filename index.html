<title>Семья</title>
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#e3e8f0; --ink:#1b2333; --muted:#5f6a82; --line:#d5dbe5;
  --brand:#23345a; --lamp:#f0ae32; --lamp-ink:#2a1d05;
  --mine:#23345a; --mine-ink:#f5f7fb; --theirs:#ffffff; --theirs-ink:#1b2333;
  --danger:#b42318; --focus:#3d6bd6; --rec:#e5484d;
  --round: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111726; --surface:#1a2235; --surface-2:#243049; --ink:#e9edf5; --muted:#97a2ba; --line:#2d3853;
    --brand:#f0ae32; --mine:#f0ae32; --mine-ink:#24190a; --theirs:#1f2940; --theirs-ink:#e9edf5;
    --danger:#ff8a80; --focus:#8fb0ff;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h,100dvh);display:flex;flex-direction:column}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ── формы ── */
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 32px)}
.wrap{max-width:420px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.brand-mark{width:52px;height:52px;flex:none;display:block}
.brand-name{font-family:var(--round);font-size:30px;font-weight:700;letter-spacing:-.01em;color:var(--brand);line-height:1.1}
.brand-sub{color:var(--muted);font-size:14px;margin-top:3px}
h2{font-family:var(--round);font-size:21px;line-height:1.25;margin:0 0 10px;font-weight:700}
p{line-height:1.45;margin:0 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;margin:0 0 20px}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .14)}
.field{display:block;margin-bottom:16px}
.field-label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field-hint{display:block;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.code-input{font-family:var(--round);font-size:19px;letter-spacing:.08em;font-weight:600}
.row{display:flex;gap:8px}
.row .input{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:12px 16px;border-radius:12px;font-weight:600;font-size:16px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--lamp);border-color:transparent;color:var(--lamp-ink);width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{min-height:0;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.6;cursor:default}
.form-error{color:var(--danger);font-size:14px;margin:0 0 12px}
.form-error:empty{display:none}
.note{font-size:13.5px;color:var(--muted)}
.steps{padding-left:22px;margin:0 0 20px;line-height:1.5}
.steps li{margin-bottom:8px}
.alt{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:4px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--lamp);border-radius:50%;animation:spin .8s linear infinite;margin:48px auto}

/* ── чат ── */
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 10px 10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand-mark{width:36px;height:36px}
.top-text{flex:1;min-width:0}
.top-title{font-family:var(--round);font-weight:700;font-size:18px;line-height:1.2}
.top-status{font-size:12.5px;color:var(--muted)}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.hint{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 14px;background:var(--surface-2);font-size:13.5px;line-height:1.35}
.hint p{margin:0;flex:1}
.hint .btn.primary{width:auto}
.hint-actions{display:flex;align-items:center;gap:4px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 12px 10px}
.older{display:block;margin:4px auto 0}
.msgs{display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.day{align-self:center;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:4px 11px;border-radius:999px;margin:16px 0 6px}
.msg{display:flex;flex-direction:column;max-width:82%;margin-top:10px}
.msg.grouped{margin-top:3px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.theirs{align-self:flex-start;align-items:flex-start}
.who{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 3px 12px}
.bubble{position:relative;padding:8px 12px 7px;border-radius:18px;line-height:1.38;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.mine .bubble{background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:6px}
.theirs .bubble{background:var(--theirs);color:var(--theirs-ink);border-bottom-left-radius:6px;box-shadow:0 0 0 1px var(--line)}
.mine.grouped .bubble{border-top-right-radius:6px}
.theirs.grouped .bubble{border-top-left-radius:6px}
.bubble a{color:inherit}
.bubble.locked{font-style:italic;opacity:.75}
.time{float:right;font-size:11px;opacity:.62;margin:7px 0 -3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bubble.media{padding:4px;white-space:normal}
.bubble.media .time{position:absolute;right:10px;bottom:9px;margin:0;float:none;opacity:1;background:rgb(0 0 0 / .5);color:#fff;padding:1px 7px;border-radius:9px}
.photo-wrap{display:block;width:240px;max-width:100%;max-height:340px;min-height:80px;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.photo{display:block;width:100%;height:100%;object-fit:cover}
.photo-wrap.failed{display:grid;place-items:center;color:var(--muted);font-size:13px}
.photo-wrap.failed::after{content:"Фото не загрузилось"}
.audio{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0 0}
.play{width:38px;height:38px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--lamp);color:var(--lamp-ink)}
.mine .play{background:var(--mine-ink);color:var(--mine)}
.play:disabled{opacity:.6}
.abar{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,currentColor 22%,transparent);cursor:pointer;position:relative}
.afill{height:100%;width:0;border-radius:3px;background:currentColor}
.adur{font-size:12.5px;opacity:.8;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.empty{text-align:center;color:var(--muted);padding:56px 24px;max-width:340px;margin:0 auto}
.empty p:first-child{font-family:var(--round);font-size:19px;font-weight:700;color:var(--ink)}
.compose{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:var(--surface);border-top:1px solid var(--line)}
.kb .compose{padding-bottom:8px}
.compose .icon-btn{width:44px;height:44px;color:var(--muted)}
.compose-input{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;line-height:1.35;padding:10px 14px;border-radius:21px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-height:140px;display:block}
.compose-input:focus{outline:none;border-color:var(--focus)}
.send{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--lamp);color:var(--lamp-ink);display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.5}
.rec{flex:1;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px;font-size:16px;font-variant-numeric:tabular-nums}
.rec-dot{width:11px;height:11px;border-radius:50%;background:var(--rec);animation:blink 1s ease-in-out infinite}
.rec-label{color:var(--muted)}

/* ── всплывающие окна ── */
.overlay{position:fixed;inset:0;background:rgb(8 12 22 / .5);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s ease-out}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease-out}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sheet-head h2{margin:0}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:13px 2px;cursor:pointer}
.menu button:last-child{border-bottom:0}
.menu b{font-weight:600;font-size:16px}
.menu span{font-size:13.5px;color:var(--muted)}
.menu .danger b{color:var(--danger)}
.linkbox{width:100%;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;word-break:break-all;margin:4px 0 10px;display:block}
.btn-row{display:flex;gap:8px;margin-bottom:14px}
.btn-row .btn{flex:1;width:auto}
.code{font-family:var(--round);font-size:30px;font-weight:700;letter-spacing:.06em;text-align:center;padding:18px 10px;background:var(--surface-2);border-radius:14px;margin:6px 0 14px;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all}
.people{list-style:none;padding:0;margin:0}
.people li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.people li:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.tag{font-size:12.5px;color:var(--muted)}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;animation:fade .15s ease-out}
.viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.viewer-bar .icon-btn{color:#fff}
.viewer-bar .btn{background:rgb(255 255 255 / .14);border-color:transparent;color:#fff}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain;padding-bottom:env(safe-area-inset-bottom)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px)}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function dayLabel(d) {
  const now = new Date(), y = new Date(); y.setDate(now.getDate() - 1);
  if (sameDay(d, now)) return 'Сегодня';
  if (sameDay(d, y)) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}
function initials(name) { return (name || '?').trim().charAt(0).toUpperCase(); }
function avatarColor(name) {
  let x = 0; for (const ch of name || '') x = (x * 31 + ch.codePointAt(0)) >>> 0;
  return 'hsl(' + (x % 360) + ' 42% 44%)';
}

// ───────────── хранилище для фонового помощника ─────────────
function idbOpen() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('semya', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbSet(k, v) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch (e) { /* без этого уведомления просто будут без текста */ }
}

// ───────────── шифрование ─────────────
const enc = new TextEncoder(), dec = new TextDecoder();
function b64e(bytes) {
  const b = new Uint8Array(bytes); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64d(str) {
  let s = str.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
async function importKey(b64) {
  const raw = b64d(b64);
  if (raw.length !== 32) throw new Error('Неверный ключ');
  return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}
async function setKey(b64) {
  familyKey = await importKey(b64);
  familyKeyB64 = b64;
  localStorage.setItem(LS_KEY, b64);
  await idbSet('familyKey', b64);
}
async function loadKey() {
  const k = localStorage.getItem(LS_KEY);
  if (!k) return;
  try { familyKey = await importKey(k); familyKeyB64 = k; idbSet('familyKey', k); }
  catch (e) { localStorage.removeItem(LS_KEY); }
}
async function newKey() { await setKey(b64e(rand(32))); }

// Сообщение — JSON {t: текст, f: файл}. Отправитель вшит в проверку: подменить автора на сервере нельзя.
async function encryptMsg(obj, senderId) {
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(senderId) }, familyKey, enc.encode(JSON.stringify(obj)));
  return { iv: b64e(iv), body: b64e(ct) };
}
async function decryptMsg(m, key) {
  try {
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64d(m.iv), additionalData: enc.encode(m.sender) }, key || familyKey, b64d(m.body));
    const o = JSON.parse(dec.decode(pt));
    const f = o.f && typeof o.f === 'object' && /^[A-Za-z0-9_-]{16,64}$/.test(o.f.path || '') && (o.f.kind === 'image' || o.f.kind === 'audio') ? o.f : null;
    return { ok: true, text: String(o.t == null ? '' : o.t), file: f };
  } catch (e) { return { ok: false, text: '', file: null }; }
}
async function keyFingerprint() {
  const d = new Uint8Array(await crypto.subtle.digest('SHA-256', b64d(familyKeyB64)));
  const parts = [];
  for (let i = 0; i < 8; i += 2) parts.push(String(((d[i] << 8) | d[i + 1]) % 10000).padStart(4, '0'));
  return parts.join(' ');
}

// ───────────── коды: приглашение и новый телефон ─────────────
// Код из 10 знаков. Из него на телефоне выводятся адрес записи и ключ, которым
// зашифрован ключ семьи. Сам код и ключ семьи на сервер не попадают.
function randomCode() { return Array.from(rand(10), (x) => CODE_ABC[x & 31]).join(''); }
const fmtCode = (c) => c.slice(0, 5) + '-' + c.slice(5);
const CYR = { 'А': 'A', 'В': 'B', 'Е': 'E', 'К': 'K', 'М': 'M', 'Н': 'H', 'О': 'O', 'Р': 'P', 'С': 'C', 'Т': 'T', 'У': 'Y', 'Х': 'X' };
function findCode(text) {
  const s0 = String(text || '');
  const m = s0.match(/[#&?]c=([0-9A-Za-z]{10})(?![0-9A-Za-z])/);
  if (m) return m[1].toUpperCase();
  const s = s0.toUpperCase().replace(/[АВЕКМНОРСТУХ]/g, (ch) => CYR[ch]);
  const m2 = s.match(/(?:^|[^0-9A-Z])([2-9A-HJ-NP-Z]{5})[\s-]?([2-9A-HJ-NP-Z]{5})(?![0-9A-Z])/);
  if (m2) return m2[1] + m2[2];
  const only = s.replace(/[^0-9A-Z]/g, '');
  return only.length === 10 && [...only].every((c) => CODE_ABC.includes(c)) ? only : null;
}
function findKey(text) {
  const s = String(text || '').replace(/&amp;/g, '&').replace(/%23/gi, '#').replace(/%26/gi, '&').replace(/%3D/gi, '=');
  const m = s.match(/[#&?]k=([A-Za-z0-9_-]{43})(?![A-Za-z0-9_-])/);
  return m ? m[1] : null;
}
const isOldInvite = (text) => /[#&?]i=[0-9a-f]{32}/.test(String(text || ''));
async function codeKeys(code) {
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode('semya-code:' + SUPABASE_URL), iterations: 300000, hash: 'SHA-256' }, base, 512));
  return {
    lookup: b64e(bits.slice(0, 32)),
    kek: await crypto.subtle.importKey('raw', bits.slice(32), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']),
  };
}
async function makeCode(kind) {
  const code = randomCode();
  const { lookup, kek } = await codeKeys(code);
  const iv = rand(12);
  const blob = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, kek, b64d(familyKeyB64));
  const { error } = await sb.rpc('create_code', { p_kind: kind, p_lookup: lookup, p_blob: b64e(blob), p_iv: b64e(iv) });
  if (error) throw error;
  return code;
}
async function unwrapFamilyKey(kek, res) {
  if (!res || !res.blob || !res.iv) throw new Error('Не удалось получить ключ семьи. Попросите новый код.');
  let raw;
  try { raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(res.iv) }, kek, b64d(res.blob)); }
  catch (e) { throw new Error('Код не подошёл к ключу. Попросите новый код.'); }
  await setKey(b64e(raw));
}

function fitViewport() {
  const vv = window.visualViewport;
  const st = document.documentElement.style;
  st.setProperty('--app-h', (vv ? vv.height : window.innerHeight) + 'px');
  st.setProperty('--app-top', (vv ? vv.offsetTop : 0) + 'px');
  document.body.classList.toggle('kb', !!vv && vv.height < window.innerHeight * 0.75);
  if (chat && chat.stick) scrollBottom();
}

function mount(node) { stopChat(); app.replaceChildren(node); }

}
function input(attrs) { return h('input', Object.assign({ class: 'input' }, attrs)); }
function field(label, control, hint) {
  return h('label', { class: 'field' }, h('span', { class: 'field-label' }, label), control,
    hint ? h('span', { class: 'field-hint' }, hint) : null);
}
function codeField(label, initial, hint) {
  const inp = input({ class: 'input code-input', type: 'text', 'aria-label': label, placeholder: 'XXXXX-XXXXX', autocapitalize: 'characters', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false' });
  if (initial) inp.value = fmtCode(initial);
  inp.addEventListener('blur', () => { const c = findCode(inp.value); if (c) inp.value = fmtCode(c); });
  const paste = h('button', { class: 'btn small', type: 'button', onclick: async () => {

    el: h('div', { class: 'field' }, h('span', { class: 'field-label' }, label), h('div', { class: 'row' }, inp, paste),

  };
}
function needName(inp) {
  const v = inp.value.trim();
  if (!v) throw new Error('Впишите, как вас называть');
  return v.slice(0, 40);
}
function needInviteCode(text) {
  const code = findCode(text);
  if (code) return code;
  if (isOldInvite(text)) throw new Error('Это приглашение старого образца. Попросите новое — теперь оно с кодом из 10 знаков.');
  throw new Error('Введите код из 10 знаков, например ABCDE-FGHJK.');
}

async function signUpOrIn(email, password) {
  if (!email) throw new Error('Впишите email');
  if (password.length < 8) throw new Error('Пароль — не короче 8 символов');
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) {
    if (/already/i.test(error.message)) {
      const r = await sb.auth.signInWithPassword({ email, password });
      if (r.error) throw new Error('Этот email уже зарегистрирован. Если это вы — проверьте пароль.');
      return;
    }
    throw error;
  }
  if (!data.session) throw new Error('В Supabase включено подтверждение email. Выключите «Confirm email» и попробуйте снова.');
}
async function createFamily(name) {
  await newKey();
  const { error } = await sb.rpc('start_family', { p_name: name });
  if (error) throw error;
}
async function joinByCode(code, name) {
  const { lookup, kek } = await codeKeys(code);
  const { data, error } = await sb.rpc('join_with_code', { p_lookup: lookup, p_name: name });
  if (error) throw error;
  await unwrapFamilyKey(kek, data);
}
function doneIncoming() {
  incoming = null;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

function showAuth(mode) {
  mode = mode || (incoming && (incoming.code || incoming.old) ? 'join' : 'login');
  const err = h('p', { class: 'form-error', role: 'alert' }, incoming && incoming.old ? 'Это приглашение старого образца. Попросите новое — теперь оно с кодом.' : null);
  const name = input({ type: 'text', maxlength: '40', autocomplete: 'nickname', placeholder: 'Например: Мама, Саша, Дед' });
  const email = input({ type: 'email', autocomplete: 'email', inputmode: 'email', autocapitalize: 'off', spellcheck: 'false', placeholder: 'name@example.com' });
  const pass = input({ type: 'password', autocomplete: mode === 'login' ? 'current-password' : 'new-password', placeholder: mode === 'login' ? '' : 'Не короче 8 символов' });
  const codeF = codeField('Код приглашения', incoming && incoming.code, 'Он есть в сообщении с приглашением.');
  const btn = h('button', { class: 'btn primary', type: 'submit' }, { login: 'Войти', join: 'Присоединиться', create: 'Создать семью' }[mode]);

  const form = h('form', { novalidate: true, onsubmit: (e) => { e.preventDefault(); busy(btn, err, async () => {
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
      if (error) throw error;
    } else if (mode === 'join') {
      const nm = needName(name);
      const code = needInviteCode(codeF.input.value);
      const { lookup } = await codeKeys(code);
      const { data: ok, error } = await sb.rpc('check_code', { p_lookup: lookup });
      if (error) throw error;
      if (!ok) throw new Error('Код не найден, уже использован или устарел. Попросите новый.');
      await signUpOrIn(email.value.trim(), pass.value);
      await joinByCode(code, nm);
    } else {
      const nm = needName(name);
      await signUpOrIn(email.value.trim(), pass.value);
      await createFamily(nm);
    }
    doneIncoming();
    await route();
  }); } },
    mode === 'login' ? null : field('Как вас называть', name),
    mode === 'join' ? codeF.el : null,
    field('Email', email),
    field('Пароль', pass, mode === 'login' ? null : 'Email нужен только для входа, писем не будет. Пароль запомните: он понадобится на новом телефоне.'),
    err, btn);

  const tab = (label, m) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(mode === m), class: mode === m ? 'on' : null, onclick: () => showAuth(m) }, label);

  mount(page(brand(),
    mode === 'create'
      ? [h('h2', {}, 'Новая семья'), h('p', { class: 'note' }, 'Вы станете администратором и сможете приглашать родных. Создать семью можно только один раз.')]
      : h('div', { class: 'seg', role: 'tablist' }, tab('Вход', 'login'), tab('Я приглашён', 'join')),
    form,
    h('div', { class: 'alt' }, mode === 'create'
      ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => showAuth('login') }, 'Назад ко входу')
      : h('button', { class: 'btn ghost small', type: 'button', onclick: () => showAuth('create') }, 'Создать семью (только при первом запуске)')),
    isIOS && !isStandalone
      ? h('p', { class: 'note', style: 'margin-top:22px' }, 'Совет: сначала установите приложение — в Safari «Поделиться» → «На экран „Домой“» — и входите уже из него. Только так будут приходить уведомления.')
      : null));
}

// В семье, но на этом устройстве нет ключа
function showNeedKey() {
  const err = h('p', { class: 'form-error', role: 'alert' });
  const codeF = codeField('Код для нового телефона', null, 'Можно вставить и резервный ключ — длинную ссылку.');

    h('h2', {}, 'Нужен ключ семьи'),

        await setKey(key);
      } else {
        const code = findCode(text);
        if (!code) throw new Error('Введите код из 10 знаков, например ABCDE-FGHJK.');

      doneIncoming();

async function logout() {
  if (!confirm('Выйти из аккаунта на этом устройстве?')) return;
  stopChat();
  try {
    const sub = swReg && swReg.pushManager ? await swReg.pushManager.getSubscription() : null;
    if (sub) { await sb.rpc('delete_push_sub', { p_endpoint: sub.endpoint }); await sub.unsubscribe(); }
  } catch (e) { /* не страшно */ }
  try { await sb.auth.signOut(); } catch (e) { /* всё равно выходим */ }
  me = null; myMember = null;
  route();
}

// ───────────── маршрутизация ─────────────
async function route() {
  if (!sb) return location.reload();
  showLoading();
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; }
  catch (e) { return showFatal(errText(e)); }
  if (!session) return showAuth();
  me = session.user;
  const { data, error } = await sb.from('members').select('user_id,name,is_admin').eq('user_id', me.id).maybeSingle();
  if (error) return showFatal(errText(error), { logout: true });
  if (!data) return showJoin();
  myMember = data;
  if (!familyKey) await loadKey();
  if (!familyKey) return showNeedKey();
  showChat();
}
async function acceptIncomingKey() {
  if (incoming && incoming.key) { try { await setKey(incoming.key); } catch (e) { /* попросим позже */ } }
}

// ───────────── уведомления ─────────────
function pushState() {
  if (!('serviceWorker' in navigator)) return 'unsupported';
  if (isIOS && !isStandalone) return 'install';
  if (!('PushManager' in window) || !('Notification' in window)) return 'unsupported';
  return Notification.permission;   // default | granted | denied
}
async function getVapid() {
  const { data, error } = await sb.rpc('get_vapid_public');
  if (error) throw error;
  if (data) return data;
  if (!myMember || !myMember.is_admin) return null;
  // Администратор при первом запуске создаёт ключи для отправки уведомлений
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  const pub = b64e(await crypto.subtle.exportKey('raw', kp.publicKey));
  const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
  const r = await sb.rpc('set_vapid', { p_public: pub, p_jwk: { kty: jwk.kty, crv: jwk.crv, x: jwk.x, y: jwk.y, d: jwk.d } });
  if (r.error) throw r.error;
  return r.data;
}
function sameBytes(a, b) { if (!a || !b || a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }

  const reg = swReg || await navigator.serviceWorker.ready;
  const pub = await getVapid();
  if (!pub) throw new Error('Уведомления заработают, когда администратор откроет обновлённое приложение');
  const want = b64d(pub);
  let sub = await reg.pushManager.getSubscription();
  const have = sub && sub.options && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
  if (sub && have && !sameBytes(have, want)) { await sub.unsubscribe(); sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_sub', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (error) throw error;
}
function enablePushClick() {
  if (!('Notification' in window)) return toast('Этот браузер не поддерживает уведомления');
  // Разрешение спрашиваем сразу по нажатию — иначе iPhone откажет
  Notification.requestPermission().then(async (perm) => {
    if (perm !== 'granted') { toast('Уведомления не разрешены'); refreshHint(); return; }
    try { await ensurePushSub(); toast('Уведомления включены'); }
    catch (e) { toast('Не получилось: ' + errText(e)); }
    refreshHint();
  });
}
function clearBadge() {
  try { if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {}); } catch (e) { /* нет значка */ }
  if (swReg && swReg.getNotifications) swReg.getNotifications().then((list) => list.forEach((n) => n.close())).catch(() => {});
}

// ───────────── чат ─────────────
function stopChat() {
  if (!chat) return;
  if (rec) finishRec(false);
  if (nowPlaying) nowPlaying.pause();
  if (chat.channel) sb.removeChannel(chat.channel);
  if (chat.io) chat.io.disconnect();
  clearInterval(chat.timer);
  chat = null;
}

async function chatInit() {
  const c = chat;
  await loadMembers();
  const { data, error } = await sb.from('messages').select(COLS).order('id', { ascending: false }).limit(PAGE);
  if (chat !== c) return;
  if (error) toast(errText(error));
  else { c.older.hidden = data.length < PAGE; await ingest(data); }
  if (chat !== c) return;
  renderAll();
  scrollBottom();
  subscribe();
  c.timer = setInterval(() => { if (document.visibilityState === 'visible') fetchNewer(); }, 20000);
  // уведомления: администратор готовит ключи, у остальных обновляется подписка
  if (myMember.is_admin) getVapid().catch(() => {});
  if (pushState() === 'granted') ensurePushSub().catch(() => {});
}

async function loadMembers() {
  const c = chat;
  const { data, error } = await sb.from('members').select('user_id,name,is_admin,joined_at').order('joined_at');
  if (!error && c && chat === c) c.members = new Map(data.map((m) => [m.user_id, m]));
}

async function ingest(rows) {
  const c = chat;
  if (!c || !rows || !rows.length) return [];
  const fresh = rows.filter((r) => !c.rows.has(r.id));
  const plain = await Promise.all(fresh.map((r) => decryptMsg(r)));
  if (chat !== c) return [];
  let unknown = false;
  const added = [];
  fresh.forEach((r, i) => {
    if (c.rows.has(r.id)) return;
    c.rows.set(r.id, { id: r.id, sender: r.sender, at: new Date(r.created_at), ok: plain[i].ok, text: plain[i].text, file: plain[i].file });
    c.minId = Math.min(c.minId, r.id);
    c.maxId = Math.max(c.maxId, r.id);
    if (!c.members.has(r.sender)) unknown = true;
    added.push(r.id);
  });
  if (unknown) await loadMembers();
  return added;
}

function memberName(id) { const m = chat && chat.members.get(id); return m ? m.name : 'Участник'; }

function linkify(text) {
  const span = h('span', { class: 'txt' });
  const re = /https?:\/\/[^\s<>"']+/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    const url = m[0].replace(/[.,!?;:)\]»]+$/, '');
    span.append(text.slice(last, m.index), h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, url));
    last = m.index + url.length;
    re.lastIndex = last;
  }
  span.append(text.slice(last));
  return span;
}

// ───────────── файлы: фото и голосовые ─────────────
function randomPath() { return b64e(rand(18)); }
function fileUrl(f) {
  if (!fileCache.has(f.path)) {
    fileCache.set(f.path, (async () => {
      const { data, error } = await sb.storage.from('files').download(f.path);
      if (error) throw error;
      const ct = new Uint8Array(await data.arrayBuffer());
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(f.iv), additionalData: enc.encode('file:' + f.path) }, familyKey, ct);
      return URL.createObjectURL(new Blob([pt], { type: f.mime || 'application/octet-stream' }));
    })().catch((e) => { fileCache.delete(f.path); throw e; }));
  }
  return fileCache.get(f.path);
}
async function sendFile(kind, blob, mime, meta) {
  const c = chat;
  if (!c) return;
  c.uploads++; setStatus();
  try {
    const path = randomPath();
    const iv = rand(12);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode('file:' + path) }, familyKey, await blob.arrayBuffer());
    const { error } = await sb.storage.from('files').upload(path, new Blob([ct], { type: 'application/octet-stream' }), { contentType: 'application/octet-stream', upsert: false });
    if (error) throw error;
    fileCache.set(path, Promise.resolve(URL.createObjectURL(blob)));   // своё видно сразу, без скачивания
    await postMsg({ v: 1, t: '', f: Object.assign({ kind, path, iv: b64e(iv), mime, size: blob.size }, meta) });
  } finally {
    c.uploads--; setStatus();
  }
}
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('Не удалось открыть фото'));
      i.src = url;
    });
    const max = 1600;
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * s)), hh = Math.max(1, Math.round(img.naturalHeight * s));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = hh;
    canvas.getContext('2d').drawImage(img, 0, 0, w, hh);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82));
    if (!blob) throw new Error('Не удалось сжать фото');
    return { blob, w, h: hh };
  } finally { URL.revokeObjectURL(url); }
}
async function sendPhoto(file) {
  try {
    const { blob, w, h: hh } = await compressImage(file);
    await sendFile('image', blob, 'image/jpeg', { w, h: hh });
  } catch (e) { toast('Фото не отправлено: ' + errText(e)); }
}

function imageWidget(f) {
  const img = h('img', { class: 'photo', alt: 'Фото', decoding: 'async' });
  const el = h('button', { class: 'photo-wrap', type: 'button', 'aria-label': 'Открыть фото', style: f.w && f.h ? 'aspect-ratio:' + f.w + ' / ' + f.h : null }, img);
  el.load = () => fileUrl(f).then((u) => { img.src = u; }).catch(() => { el.classList.add('failed'); img.remove(); });
  el.addEventListener('click', () => openViewer(f));
  return el;
}

function audioWidget(f) {
  const icon = h('span', { style: 'display:grid' }, iconPlay());
  const btn = h('button', { class: 'play', type: 'button', 'aria-label': 'Слушать' }, icon);
  const fill = h('div', { class: 'afill' });
  const bar = h('div', { class: 'abar' }, fill);
  const time = h('span', { class: 'adur' }, fmtDur(f.dur));
  const el = h('div', { class: 'audio' }, btn, bar, time);
  let audio = null, loading = null;
  const total = () => (audio && isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (f.dur || 0));
  const setIcon = (playing) => { icon.replaceChildren(playing ? iconPause() : iconPlay()); btn.setAttribute('aria-label', playing ? 'Пауза' : 'Слушать'); };
  el.load = () => loading || (loading = fileUrl(f).then((u) => {
    if (audio) return;
    audio = new Audio();
    audio.preload = 'auto';
    audio.src = u;
    audio.addEventListener('timeupdate', () => {
      const t = total();
      fill.style.width = t ? Math.min(100, (audio.currentTime / t) * 100) + '%' : '0';
      time.textContent = fmtDur(audio.currentTime);
    });
    audio.addEventListener('play', () => setIcon(true));
    audio.addEventListener('pause', () => setIcon(false));
    audio.addEventListener('ended', () => { setIcon(false); fill.style.width = '0'; time.textContent = fmtDur(f.dur); });
  }).catch((e) => { loading = null; throw e; }));
  btn.addEventListener('click', async () => {
    if (!audio) {
      btn.disabled = true;
      try { await el.load(); } catch (e) { toast('Не удалось загрузить голосовое'); }
      finally { btn.disabled = false; }
      if (!audio) return;
    }
    if (audio.paused) {
      if (nowPlaying && nowPlaying !== audio) nowPlaying.pause();
      nowPlaying = audio;
      audio.play().catch(() => toast('Нажмите ещё раз, чтобы послушать'));
    } else audio.pause();
  });
  bar.addEventListener('click', (e) => {
    if (!audio) return;
    const r = bar.getBoundingClientRect();
    audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * total();
  });
  return el;
}

function mediaFor(m) {
  const c = chat;
  let el = c.media.get(m.id);
  if (!el) {
    el = m.file.kind === 'image' ? imageWidget(m.file) : audioWidget(m.file);
    c.media.set(m.id, el);
    c.io.observe(el);
  }
  return el;
}

async function openViewer(f) {
  let u;
  try { u = await fileUrl(f); } catch (e) { return toast('Не удалось открыть фото'); }
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const close = () => { v.remove(); document.removeEventListener('keydown', onKey); };
  const share = navigator.share ? h('button', { class: 'btn small', type: 'button', onclick: async () => {
    try {
      const b = await (await fetch(u)).blob();
      const file = new File([b], 'photo.jpg', { type: b.type || 'image/jpeg' });
      if (navigator.canShare && !navigator.canShare({ files: [file] })) return toast('Не получается поделиться этим фото');
      await navigator.share({ files: [file] });
    } catch (e) { /* закрыли окно */ }
  } }, 'Сохранить или отправить') : null;
  const v = h('div', { class: 'viewer', role: 'dialog', 'aria-label': 'Фото' },
    h('div', { class: 'viewer-bar' }, h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Закрыть', onclick: close }, iconClose()), share),
    h('img', { src: u, alt: 'Фото' }));
  document.addEventListener('keydown', onKey);
  document.body.append(v);
}

// ───────────── голосовые ─────────────
function recSupported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function pickMime() {
  for (const t of ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm']) {
    try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) { /* дальше */ }
  }
  return '';
}
function updateAction() {
  const c = chat;
  if (!c) return;
  const mic = !c.ta.value.trim() && recSupported();
  c.send.dataset.mode = mic ? 'mic' : 'send';
  c.send.replaceChildren(mic ? iconMic() : iconSend());
  c.send.setAttribute('aria-label', mic ? 'Записать голосовое' : 'Отправить');
}
async function startRec() {
  const c = chat;
  if (!c || rec) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { return toast('Нет доступа к микрофону. Разрешите его в настройках телефона.'); }
  if (chat !== c) { stream.getTracks().forEach((t) => t.stop()); return; }
  const mime = pickMime();
  let mr;
  try { mr = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: 48000 }, mime ? { mimeType: mime } : {})); }
  catch (e) {
    try { mr = new MediaRecorder(stream); }
    catch (e2) { stream.getTracks().forEach((t) => t.stop()); return toast('На этом телефоне запись голоса не работает'); }
  }
  const r = { mr, stream, chunks: [], start: Date.now(), timer: null, label: h('span', {}, '0:00') };
  mr.ondataavailable = (e) => { if (e.data && e.data.size) r.chunks.push(e.data); };
  mr.start();
  rec = r;
  const cancel = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Удалить запись', onclick: () => finishRec(false) }, iconTrash());
  const sendRec = h('button', { class: 'send', type: 'button', 'aria-label': 'Отправить голосовое', onclick: () => finishRec(true) }, iconSend());
  c.compose.replaceChildren(cancel, h('div', { class: 'rec' }, h('span', { class: 'rec-dot' }), r.label, h('span', { class: 'rec-label' }, 'Запись…')), sendRec);
  r.timer = setInterval(() => {
    const s = (Date.now() - r.start) / 1000;
    r.label.textContent = fmtDur(s);
    if (s >= MAX_REC) finishRec(true);
  }, 250);
}
function finishRec(send) {
  const r = rec;
  if (!r) return;
  rec = null;
  clearInterval(r.timer);
  const dur = Math.round((Date.now() - r.start) / 1000);
  const c = chat;
  if (c) { c.compose.replaceChildren(c.attach, c.ta, c.send); updateAction(); }
  r.mr.onstop = async () => {
    r.stream.getTracks().forEach((t) => t.stop());
    if (!send || !chat) return;
    if (dur < 1 || !r.chunks.length) return toast('Слишком короткое голосовое');
    const type = (r.mr.mimeType || r.chunks[0].type || 'audio/mp4').split(';')[0];
    try { await sendFile('audio', new Blob(r.chunks, { type }), type, { dur }); }
    catch (e) { toast('Голосовое не отправлено: ' + errText(e)); }
  };
  try { r.mr.stop(); } catch (e) { r.stream.getTracks().forEach((t) => t.stop()); }
}

// ───────────── сообщения ─────────────
function msgNode(m, prev) {
  const mine = m.sender === me.id;
  const grouped = !!prev && prev.sender === m.sender && (m.at - prev.at) < 5 * 60 * 1000;
  const time = h('span', { class: 'time' }, fmtTime(m.at));
  let bubble;
  if (!m.ok) bubble = h('div', { class: 'bubble locked' }, h('span', { class: 'txt' }, 'Не удалось расшифровать'), time);
  else if (m.file && m.file.kind === 'image') bubble = h('div', { class: 'bubble media' }, mediaFor(m), time);
  else if (m.file) bubble = h('div', { class: 'bubble' }, mediaFor(m), time);
  else bubble = h('div', { class: 'bubble' }, linkify(m.text), time);
  return h('div', { class: 'msg ' + (mine ? 'mine' : 'theirs') + (grouped ? ' grouped' : '') },
    !mine && !grouped ? h('div', { class: 'who' }, memberName(m.sender)) : null, bubble);
}

function emptyState() {
  const alone = chat.members.size <= 1 && myMember.is_admin;
  return h('div', { class: 'empty' },
    h('p', {}, 'Здесь пока тихо'),
    h('p', {}, alone
      ? 'Пригласите родных: меню ⋯ → «Пригласить в семью». А первое сообщение можно написать уже сейчас.'
      : 'Напишите первое сообщение.'));
}

function renderAll() {
  const c = chat;
  if (!c) return;
  const list = [...c.rows.values()].sort((a, b) => a.id - b.id);
  const frag = document.createDocumentFragment();
  let prev = null;
  for (const m of list) {
    if (!prev || !sameDay(prev.at, m.at)) { frag.append(h('div', { class: 'day' }, dayLabel(m.at))); prev = null; }
    frag.append(msgNode(m, prev));
    prev = m;
  }
  if (!list.length) frag.append(emptyState());
  c.msgs.replaceChildren(frag);
}

function nearBottom() { const s = chat.scroll; return s.scrollHeight - s.scrollTop - s.clientHeight < 120; }
function scrollBottom() {
  if (!chat) return;
  chat.stick = true;
  requestAnimationFrame(() => { if (chat) chat.scroll.scrollTop = chat.scroll.scrollHeight; });
}
function autosize() {
  const ta = chat && chat.ta;
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight + 2, 140) + 'px';
}

function subscribe() {
  const c = chat;
  c.channel = sb.channel('family-messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => onIncoming([payload.new]))
    .subscribe((st) => {
      if (chat !== c) return;
      c.online = st === 'SUBSCRIBED';
      setStatus();
      if (c.online) fetchNewer();
    });
}

async function onIncoming(rows) {
  const c = chat;
  if (!c) return;
  const stick = c.stick;
  const added = await ingest(rows);
  if (!added.length || chat !== c) return;
  renderAll();
  if (stick) scrollBottom();
  else if (rows.some((r) => r.sender !== me.id)) toast('Новое сообщение внизу');
}

async function fetchNewer() {
  const c = chat;
  if (!c || c.fetching) return;
  c.fetching = true;
  try {
    const { data, error } = await sb.from('messages').select(COLS).gt('id', c.maxId).order('id', { ascending: true }).limit(500);
    if (!error && data.length) await onIncoming(data);
  } finally { c.fetching = false; }
}

async function loadOlder() {
  const c = chat;
  if (!c || !isFinite(c.minId)) return;
  c.older.disabled = true;
  const { data, error } = await sb.from('messages').select(COLS).lt('id', c.minId).order('id', { ascending: false }).limit(PAGE);
  if (chat !== c) return;
  c.older.disabled = false;
  if (error) return toast(errText(error));
  c.older.hidden = data.length < PAGE;
  const fromBottom = c.scroll.scrollHeight - c.scroll.scrollTop;
  await ingest(data);
  renderAll();
  c.scroll.scrollTop = c.scroll.scrollHeight - fromBottom;
}

async function postMsg(obj) {
  const c = chat;
  const { iv, body } = await encryptMsg(obj, me.id);
  const { data, error } = await sb.from('messages').insert({ sender: me.id, iv, body }).select(COLS).single();
  if (error) throw error;
  if (chat === c) { c.stick = true; await onIncoming([data]); }
}

async function doSend() {
  const c = chat;
  if (!c || c.sending) return;
  const text = c.ta.value.trim();
  if (!text) return;
  c.sending = true; c.send.disabled = true;
  try {
    await postMsg({ v: 1, t: text });
    if (chat === c) { c.ta.value = ''; autosize(); updateAction(); }
  } catch (e) {
    toast('Не отправлено: ' + errText(e));
  } finally { c.sending = false; c.send.disabled = false; }
}

// ───────────── меню ─────────────
function sheet(title, ...content) {
  const overlay = h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const close = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);
  overlay.append(h('div', { class: 'sheet' },
    h('div', { class: 'sheet-head' }, h('h2', {}, title),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Закрыть', onclick: close }, iconClose())),
    ...content));
  document.body.append(overlay);
  return close;
}
function shareRow(text) {
  const row = h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => copyText(text) }, 'Скопировать'));
  if (navigator.share) row.append(h('button', { class: 'btn', type: 'button', onclick: () => navigator.share({ text }).catch(() => {}) }, 'Поделиться'));
  return row;
}

function openMenu() {
  const item = (title, sub, fn, cls) => h('button', { type: 'button', class: cls || null, onclick: () => { close(); fn(); } },
    h('b', {}, title), h('span', {}, sub));
  const close = sheet('Меню', h('div', { class: 'menu' },
    myMember.is_admin ? item('Пригласить в семью', 'Код для одного человека', doInvite) : null,
    item('Код для нового телефона', 'Чтобы войти на другом устройстве', doDeviceCode),
    item('Уведомления', 'Включить или проверить', showPushSettings),
    item('Участники', 'Кто есть в семейном чате', showMembers),
    item('Резервный ключ', 'На случай, если потеряются все телефоны', showBackupKey),
    item('Код проверки', 'Убедиться, что у всех один ключ', showFingerprint),
    item('Выйти', 'Из аккаунта на этом устройстве', logout, 'danger')));
}

async function doInvite() {
  let code;
  try { code = await makeCode('invite'); } catch (e) { return toast(errText(e)); }
  const text = 'Приглашение в наш семейный чат «' + APP_NAME + '».\nСсылка: ' + baseUrl() + '#c=' + code + '\nКод: ' + fmtCode(code);
  sheet('Приглашение',
    h('p', {}, 'Отправьте одному человеку. Код работает один раз и действует 7 дней.'),
    h('div', { class: 'code' }, fmtCode(code)),
    shareRow(text),
    h('p', { class: 'note' }, 'Ключа шифрования в приглашении нет, только код. Если ссылка откроется неправильно, человек просто введёт эти 10 знаков в приложении.'));
}

async function doDeviceCode() {
  let code;
  try { code = await makeCode('device'); } catch (e) { return toast(errText(e)); }
  sheet('Код для нового телефона',
    h('div', { class: 'code' }, fmtCode(code)),
    h('p', {}, 'Войдите на новом устройстве со своим email и паролем — приложение попросит этот код. Подойдёт и для члена семьи, если он сменил телефон.'),
    shareRow('Код для нового телефона в «' + APP_NAME + '»: ' + fmtCode(code)),
    h('p', { class: 'note' }, 'Код работает один раз и действует сутки.'));
}

function showBackupKey() {
  const link = baseUrl() + '#k=' + familyKeyB64;
  const ta = h('textarea', { class: 'linkbox', readonly: true, rows: '3', 'aria-label': 'Резервный ключ' });
  ta.value = link;
  ta.addEventListener('focus', () => ta.select());
  sheet('Резервный ключ',
    h('p', {}, 'Сохраните в заметках под паролем. Пригодится, если потеряются все телефоны: войдите с email и паролем и вставьте эту ссылку вместо кода.'),
    ta,
    h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => copyText(link) }, 'Скопировать')),
    h('p', { class: 'note' }, 'Это ключ ко всей переписке. Не отправляйте его в мессенджеры и никому вне семьи.'));
}

function showPushSettings() {
  const st = pushState();
  const parts = [];
  if (st === 'install') {
    parts.push(h('p', {}, 'На iPhone уведомления работают только у приложения с экрана «Домой». В Safari: «Поделиться» → «На экран „Домой“». Потом войдите там и введите код из меню ⋯ → «Код для нового телефона».'));
  } else if (st === 'unsupported') {
    parts.push(h('p', {}, 'Здесь уведомления не поддерживаются. На iPhone нужна iOS 16.4 или новее и приложение с экрана «Домой».'));
  } else if (st === 'denied') {
    parts.push(h('p', {}, 'Уведомления запрещены. Включите их в настройках: на iPhone — Настройки → Уведомления → «' + APP_NAME + '», на Android — значок замка в адресной строке Chrome → Уведомления.'));
  } else if (st === 'granted') {
    const btn = h('button', { class: 'btn primary', type: 'button' }, 'Проверить подписку');
    btn.addEventListener('click', () => busy(btn, null, async () => { await ensurePushSub(); toast('Всё в порядке'); }));
    parts.push(h('p', {}, 'Уведомления включены. В них видно, кто написал, и сам текст: его расшифровывает ваш телефон.'), btn);
  } else {
    parts.push(h('p', {}, 'Включите, чтобы узнавать о новых сообщениях, даже когда приложение закрыто.'),
      h('button', { class: 'btn primary', type: 'button', onclick: enablePushClick }, 'Включить уведомления'));
  }
  sheet('Уведомления', ...parts);
}

async function showMembers() {
  await loadMembers();
  const list = chat ? [...chat.members.values()] : [];
  sheet('Участники', h('ul', { class: 'people' }, list.map((m) => h('li', {},
    h('span', { class: 'avatar', style: 'background:' + avatarColor(m.name) }, initials(m.name)),
    h('div', {}, h('div', {}, m.name + (m.user_id === me.id ? ' (вы)' : '')),
      m.is_admin ? h('div', { class: 'tag' }, 'администратор') : null)))));
}

async function showFingerprint() {
  const code = await keyFingerprint();
  sheet('Код проверки', h('div', { class: 'code' }, code),
    h('p', {}, 'У всех членов семьи этот код должен совпадать. Сверьте его при встрече или по телефону. Если у кого-то он другой — у него неправильный ключ.'));
}

// ───────────── запуск ─────────────
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitViewport);
  visualViewport.addEventListener('scroll', fitViewport);
}
addEventListener('resize', fitViewport);
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; refreshHint(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { fetchNewer(); clearBadge(); } });
addEventListener('online', () => fetchNewer());

(async function start() {
  document.title = APP_NAME;
  fitViewport();
  if (location.hash.length > 1) {
    const hash = location.hash;
    const code = findCode(hash), key = findKey(hash);
    if (code || key) incoming = { code, key, raw: location.href };
    else if (isOldInvite(hash)) incoming = { old: true };
    // Ключ из адресной строки убираем сразу. Код оставляем, пока он не использован,
    // чтобы ссылка не терялась при переходе из мессенджера в Safari.
    if (key || !code || isStandalone) history.replaceState(null, '', location.pathname + location.search);
  }
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) return showFatal('Откройте приложение по адресу, который начинается с https://', { reload: true });
  if (!window.supabase || !window.supabase.createClient) return showFatal('Не загрузилась нужная библиотека. Проверьте интернет и нажмите «Повторить».', { reload: true });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then((r) => { swReg = r; }).catch(() => { /* без уведомлений */ });
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });
  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT' && chat) setTimeout(() => { stopChat(); route(); }, 0);
  });
  if (incoming && (incoming.code || incoming.key) && isIOS && !isStandalone) return showInstall();
  await acceptIncomingKey();
  route();
})();
</script>
